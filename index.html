<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QXView</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff}

.logo-container{width:460px;height:460px;position:relative;z-index:5;transform-origin:center center;transition:transform 3s cubic-bezier(0.22,1,0.36,1),opacity 1.5s ease,z-index 0.3s ease 2.5s}
.logo-container svg{width:100%;height:100%;overflow:visible;display:block}
.logo-container.expanded{transform:scale(2.2);opacity:0.25;z-index:0;pointer-events:none}

.hexagon-border{fill:none;stroke:url(#cyanGrad);stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:170;stroke-dashoffset:170;animation:drawHex 2s ease-out forwards}
.hexagon{fill:none;stroke:url(#blueGrad);stroke-width:3;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:170;stroke-dashoffset:170;animation:drawHex 2s ease-out forwards}
.bar{animation:growBar 2s ease-out forwards;opacity:0;fill:#000;stroke:url(#cyanGrad);stroke-width:2;stroke-linejoin:miter;transform-box:fill-box;transform-origin:center bottom}
.bar-2{stroke-width:3}
.notch-fill{fill:none;stroke:url(#cyanGrad);stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:40;stroke-dashoffset:40;animation:revealHead 2s ease-out forwards}
.notch-fill-inner{fill:none;stroke:url(#blueGrad);stroke-width:3;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:40;stroke-dashoffset:40;animation:revealHead 2s ease-out forwards}

@keyframes drawHex{to{stroke-dashoffset:0}}
@keyframes growBar{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes revealHead{to{stroke-dashoffset:0}}

.chart-container{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);z-index:1;opacity:0;pointer-events:none;transition:opacity 0.5s ease,left 0.3s ease,height 0.3s ease}
.chart-container.visible{opacity:1;pointer-events:auto}
#tvChart{width:100%;height:100%;touch-action:none}

.floating-indicators{position:absolute;top:56px;left:8px;z-index:10;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 16px);pointer-events:none}
.floating-indicator-group{display:flex;flex-direction:column;gap:2px;pointer-events:auto}
.floating-indicator-header{display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:4px;cursor:pointer;transition:background 0.15s ease;user-select:none}
.floating-indicator-header:hover{background:rgba(17,17,17,0.95);border-color:rgba(255,255,255,0.3)}
.floating-indicator-header .expand-icon{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease;flex-shrink:0}
.floating-indicator-header.expanded .expand-icon{transform:rotate(90deg)}
.floating-indicator-header .ind-name{color:#fff;font-size:11px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.floating-indicator-header .ind-actions{display:flex;gap:2px;flex-shrink:0}
.floating-indicator-header .ind-action{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#888;cursor:pointer;padding:0;transition:all 0.15s ease}
.floating-indicator-header .ind-action:hover{background:rgba(255,255,255,0.1);color:#fff}
.floating-indicator-header .ind-action.delete-ind:hover{color:#ff4466;background:rgba(255,68,102,0.15)}
.floating-indicator-header .ind-action svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.floating-plot-item{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 20px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);border-radius:3px;direction:ltr;transition:background 0.15s ease;max-width:100%}
.floating-plot-item:hover{background:rgba(17,17,17,0.85);border-color:rgba(255,255,255,0.2)}
.floating-plot-item.hidden-plot{opacity:0.4}
.floating-plot-item.hidden-plot .plot-name{text-decoration:line-through;color:#888}
.plot-color{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.plot-name{color:#fff;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.plot-actions{display:flex;gap:2px;flex-shrink:0}
.plot-action{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#888;cursor:pointer;padding:0;transition:all 0.15s ease}
.plot-action:hover{background:rgba(255,255,255,0.1);color:#fff}
.plot-action svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toggle-indicators-arrow{align-self:flex-start;width:24px;height:14px;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color 0.15s ease,background 0.15s ease;padding:0;pointer-events:auto}
.toggle-indicators-arrow:hover{color:#fff;background:rgba(0,0,0,0.95)}
.toggle-indicators-arrow svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.toggle-indicators-arrow.collapsed svg{transform:rotate(180deg)}
.ind-list-wrapper.hidden{display:none}

.top-controls{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;flex-direction:column;gap:0;opacity:0;transform:translateY(-20px);transition:opacity 0.5s ease,transform 0.5s ease,left 0.3s ease;pointer-events:none;direction:ltr}
.top-controls.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.top-bar{display:flex;align-items:center;gap:0;padding:0 8px;height:48px;background:#000;border-bottom:1px solid #1a1a1a}
.top-row{display:flex;align-items:center;gap:0;flex:1;height:100%}
.top-btn{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;background:transparent;border:none;border-right:1px solid #1a1a1a;color:#fff;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s ease;position:relative}
.top-btn:hover{background:#111}
.top-btn svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.top-btn.open svg.chevron{transform:rotate(180deg)}
.symbol-btn{flex-direction:row;gap:8px;padding:0 14px}
.symbol-name{color:#fff;font-size:14px;font-weight:600}
.symbol-info{display:flex;align-items:center;gap:8px;margin-left:8px}
.symbol-price{color:#fff;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.symbol-change{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.symbol-change.positive{color:#00ff88}
.symbol-change.negative{color:#ff4466}
.tf-btn{padding:0 12px;font-size:13px;font-weight:500}

.overlay-menu{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:50;opacity:0;pointer-events:none;transition:opacity 0.3s ease;overflow-y:auto;padding:30px 30px 90px}
.overlay-menu.visible{opacity:1;pointer-events:auto}
.overlay-header{max-width:1200px;margin:0 auto 20px}
.overlay-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.overlay-title{color:#fff;font-size:18px;font-weight:600;letter-spacing:0.3px}
.close-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #1a1a1a;border-radius:4px;color:#fff;cursor:pointer;transition:all 0.2s ease}
.close-btn:hover{background:#111;color:#fff}
.close-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search-box{position:relative;width:100%}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#888;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-input{width:100%;padding:10px 14px 10px 38px;background:#000;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s ease;direction:ltr}
.search-input::placeholder{color:#888}
.search-input:focus{border-color:#fff}
.no-results{text-align:center;padding:40px 20px;color:#888;font-size:13px;display:none}
.no-results.visible{display:block}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-width:1200px;margin:0 auto}
.item-card{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#000;border:1px solid #1a1a1a;border-radius:4px;cursor:pointer;transition:all 0.15s ease;opacity:0;transform:translateY(10px);animation:cardIn 0.3s forwards}
.item-card:hover{background:#111;border-color:#333}
.item-card.active{border-color:#00ff88;background:#111}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.item-symbol{color:#fff;font-size:13px;font-weight:600}
.item-change{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.item-change.positive{color:#00ff88}
.item-change.negative{color:#ff4466}

.tf-dropdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.95);min-width:240px;background:#000;border:1px solid #1a1a1a;border-radius:6px;padding:8px;opacity:0;pointer-events:none;transition:all 0.2s ease;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,0.8)}
.tf-dropdown.visible{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.tf-dropdown-header{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 10px;margin-bottom:4px;border-bottom:1px solid #1a1a1a}
.tf-dropdown-title{color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.tf-dropdown-close{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#fff;cursor:pointer;transition:all 0.2s ease}
.tf-dropdown-close:hover{background:#111;color:#fff}
.tf-dropdown-close svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.tf-options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tf-option{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;border-radius:4px;border:1px solid transparent;transition:all 0.15s ease}
.tf-option:hover{background:#111}
.tf-option.active{background:#00ff88;color:#000}
.tf-option .tf-label{font-size:10px;color:#888;font-weight:400}
.tf-option.active .tf-label{color:rgba(0,0,0,0.7)}

.editor-page{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);background:#000;z-index:80;opacity:0;pointer-events:none;transition:opacity 0.3s ease,left 0.3s ease,height 0.3s ease;display:flex;flex-direction:column}
.editor-page.visible{opacity:1;pointer-events:auto}
.editor-toolbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#000;border-bottom:1px solid #1a1a1a;flex-shrink:0;direction:ltr;height:48px}
.editor-toolbar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.editor-toolbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.current-indicator-display{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#000;border:1px solid #1a1a1a;border-radius:4px;min-width:0;max-width:260px}
.current-indicator-name{color:#fff;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.current-indicator-actions{display:flex;gap:2px;flex-shrink:0}
.ci-action{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#fff;cursor:pointer;transition:all 0.15s ease;padding:0}
.ci-action svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ci-action:hover{background:#111;color:#fff}
.editor-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:transparent;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
.editor-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.editor-btn:hover{background:#111;border-color:#333}
.editor-btn.primary{background:#00ff88;border-color:#00ff88;color:#000}
.editor-btn.primary:hover{background:#00ff99;border-color:#00ff99}
.editor-btn.primary:active{transform:scale(0.97)}
.editor-btn.primary.running{background:#ff4466;border-color:#ff4466;color:#fff}
.editor-btn.primary.running:hover{background:#ff5577;border-color:#ff5577}

.indicators-list-wrapper{background:#000;border-bottom:1px solid #1a1a1a;flex-shrink:0;direction:ltr;overflow:hidden;transition:max-height 0.3s ease;max-height:200px}
.indicators-list-wrapper.collapsed{max-height:0;border-bottom-color:transparent}
.indicators-list-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #1a1a1a}
.indicators-list-title{color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.indicators-list-count{color:#888;font-size:11px}
.indicators-list-body{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 10px;max-height:140px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
.indicators-list-body::-webkit-scrollbar{height:4px;width:4px}
.indicators-list-body::-webkit-scrollbar-track{background:transparent}
.indicators-list-body::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.ind-list-item{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#000;border:1px solid #1a1a1a;border-radius:4px;cursor:pointer;transition:all 0.15s ease}
.ind-list-item:hover{background:#111;border-color:#333}
.ind-list-item.active{border-color:#00ff88}
.ind-list-item.hidden-ind{opacity:0.5}
.ind-list-item.hidden-ind .ind-list-name{text-decoration:line-through}
.ind-list-color{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ind-list-name{color:#fff;font-size:11px;font-weight:500;white-space:nowrap}
.ind-list-status{width:5px;height:5px;border-radius:50%;background:#00ff88;flex-shrink:0}
.ind-list-status.inactive{background:#888}
.toggle-list-btn{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-50%);width:32px;height:16px;background:#000;border:1px solid #1a1a1a;border-top:none;border-radius:0 0 6px 6px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s ease;z-index:5;padding:0}
.toggle-list-btn:hover{color:#fff;background:#111}
.toggle-list-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.toggle-list-btn.collapsed svg{transform:rotate(180deg)}

.editor-body{flex:1;display:flex;overflow:hidden;position:relative;direction:ltr;min-height:0}
.editor-sidebar{width:220px;background:#000;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:10px 12px;border-bottom:1px solid #1a1a1a;color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.sidebar-list{flex:1;overflow-y:auto;padding:4px}
.sidebar-item{display:flex;align-items:center;gap:6px;padding:7px 10px;color:#fff;font-size:12px;border-radius:4px;cursor:pointer;transition:all 0.15s ease;margin-bottom:1px;position:relative}
.sidebar-item:hover{background:#111}
.sidebar-item.active{background:#00ff88;color:#000}
.sidebar-item.active .sidebar-delete-btn{color:rgba(0,0,0,0.5)}
.sidebar-item.active .sidebar-delete-btn:hover{color:#ff4466;background:rgba(255,68,102,0.2)}
.sidebar-item svg.item-icon{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar-item .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .item-status{width:6px;height:6px;border-radius:50%;background:#00ff88;flex-shrink:0}
.sidebar-item .item-status.inactive{background:#888}
.sidebar-delete-btn{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#666;cursor:pointer;padding:0;transition:all 0.15s ease;flex-shrink:0;opacity:0}
.sidebar-item:hover .sidebar-delete-btn{opacity:1}
.sidebar-delete-btn:hover{color:#ff4466;background:rgba(255,68,102,0.15)}
.sidebar-delete-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.editor-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.code-wrapper{flex:1;overflow:hidden;position:relative;background:#000;min-height:0}
.CodeMirror{height:100% !important;font-family:'Consolas','Monaco',monospace !important;font-size:13px !important;line-height:1.6 !important;background:#000 !important;color:#fff !important}
.CodeMirror-gutters{background:#000 !important;border-right:1px solid #1a1a1a !important}
.CodeMirror-linenumber{color:#888 !important;padding:0 8px !important}
.CodeMirror-cursor{border-left:1px solid #fff !important}
.CodeMirror-selected{background:rgba(0,255,136,0.3) !important}
.CodeMirror-activeline-background{background:rgba(17,17,17,0.5) !important}
.CodeMirror-matchingbracket{color:#fff !important;border-bottom:1px solid #fff}
.editor-side-toolbar{position:absolute;top:8px;right:8px;z-index:15;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.editor-side-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;cursor:pointer;pointer-events:auto;transition:all 0.15s ease;padding:0;position:relative}
.editor-side-btn:hover{background:rgba(17,17,17,0.95);border-color:rgba(255,255,255,0.3)}
.editor-side-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.editor-side-btn.copied{border-color:#00ff88;color:#00ff88}
.editor-side-btn .tooltip{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.95);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:10px;font-weight:500;padding:3px 6px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s ease;font-family:inherit;letter-spacing:0.3px}
.editor-side-btn:hover .tooltip{opacity:1}
.editor-console{height:0;background:#000;border-top:1px solid #1a1a1a;overflow:hidden;transition:height 0.2s ease;display:flex;flex-direction:column;flex-shrink:0;position:relative}
.editor-console.visible{height:var(--console-height,140px)}
.console-resize-handle{position:absolute;top:-4px;left:0;width:100%;height:8px;background:transparent;cursor:ns-resize;z-index:10}
.console-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #1a1a1a;flex-shrink:0;cursor:ns-resize;user-select:none}
.console-title{color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;pointer-events:none}
.console-header-actions{display:flex;align-items:center;gap:4px}
.console-clear{background:transparent;border:none;color:#888;font-size:11px;cursor:pointer;padding:2px 8px;border-radius:3px;transition:all 0.15s ease}
.console-clear:hover{color:#fff;background:#111}
.console-close{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#888;cursor:pointer;transition:all 0.15s ease;padding:0}
.console-close:hover{background:rgba(255,68,102,0.15);color:#ff4466}
.console-close svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.console-output{flex:1;overflow-y:auto;padding:8px 12px;font-family:'Consolas',monospace;font-size:12px;color:#fff;line-height:1.5}
.console-line{padding:2px 0;display:flex;gap:8px}
.console-line .prefix{color:#888;flex-shrink:0}
.console-line.error .prefix{color:#ff4466}
.console-line.error .msg{color:#ff4466}
.console-line.success .prefix{color:#00ff88}
.console-line.success .msg{color:#00ff88}
.console-line.info .msg{color:#fff}

.signals-page{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);background:#000;z-index:75;opacity:0;pointer-events:none;transition:opacity 0.3s ease,left 0.3s ease,height 0.3s ease;overflow-y:auto;padding:30px 30px 90px;direction:ltr}
.signals-page.visible{opacity:1;pointer-events:auto}
.signals-header{max-width:1200px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid #1a1a1a}
.signals-title{color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.signals-title svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.signals-count{background:rgba(255,68,102,0.15);color:#ff4466;font-size:11px;padding:3px 10px;border-radius:4px;font-weight:600}
.signals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.signal-card{padding:16px;background:#000;border:1px solid #1a1a1a;border-radius:6px;transition:all 0.2s ease;opacity:0;transform:translateY(10px);animation:cardIn 0.3s forwards}
.signal-card:hover{background:#111;border-color:#333}
.signal-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.signal-symbol{color:#fff;font-size:14px;font-weight:600}
.signal-type{padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.signal-type.buy{background:rgba(0,255,136,0.15);color:#00ff88}
.signal-type.sell{background:rgba(255,68,102,0.15);color:#ff4466}
.signal-details{display:flex;flex-direction:column;gap:6px;font-size:12px}
.signal-row{display:flex;justify-content:space-between;color:#888}
.signal-row .val{color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.signal-time{margin-top:10px;padding-top:10px;border-top:1px solid #1a1a1a;color:#888;font-size:11px}

.indicators-page{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);background:#000;z-index:75;opacity:0;pointer-events:none;transition:opacity 0.3s ease,left 0.3s ease,height 0.3s ease;overflow-y:auto;padding:30px 30px 90px;direction:ltr}
.indicators-page.visible{opacity:1;pointer-events:auto}
.indicators-page-header{max-width:1200px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid #1a1a1a}
.indicators-page-title{color:#fff;font-size:18px;font-weight:600}
.indicators-page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.ind-page-card{padding:16px;background:#000;border:1px solid #1a1a1a;border-radius:6px;cursor:pointer;transition:all 0.2s ease;opacity:0;transform:translateY(10px);animation:cardIn 0.3s forwards}
.ind-page-card:hover{background:#111;border-color:#333}
.ind-page-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ind-page-name{color:#fff;font-size:13px;font-weight:600}
.ind-page-status{width:8px;height:8px;border-radius:50%;background:#00ff88}
.ind-page-status.inactive{background:#888}
.ind-page-desc{color:#888;font-size:11px;margin-bottom:12px;line-height:1.5}
.ind-page-actions{display:flex;gap:6px}
.ind-page-btn{flex:1;padding:6px 10px;background:#000;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
.ind-page-btn:hover{background:#111;border-color:#333}
.ind-page-btn.toggle.active{background:rgba(0,255,136,0.15);border-color:#00ff88;color:#00ff88}
.ind-page-btn.delete-btn{flex:0 0 auto;padding:6px 10px;color:#ff4466;border-color:rgba(255,68,102,0.3)}
.ind-page-btn.delete-btn:hover{background:rgba(255,68,102,0.15);border-color:#ff4466}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.modal-overlay.visible{opacity:1;pointer-events:auto}
.modal{width:90%;max-width:420px;background:#000;border:1px solid #1a1a1a;border-radius:8px;padding:24px;transform:scale(0.95);transition:transform 0.2s ease}
.modal-overlay.visible .modal{transform:scale(1)}
.modal-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:6px}
.modal-desc{color:#888;font-size:12px;margin-bottom:18px}
.modal-input{width:100%;padding:10px 12px;background:#000;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s ease;margin-bottom:6px;direction:ltr;text-align:left}
.modal-input:focus{border-color:#00ff88}
.modal-input::placeholder{color:#888}
.modal-filename{color:#888;font-size:11px;margin-bottom:18px;direction:ltr;text-align:left}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:8px 16px;background:transparent;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
.modal-btn:hover{background:#111;border-color:#333}
.modal-btn.primary{background:#00ff88;border-color:#00ff88;color:#000}
.modal-btn.primary:hover{background:#00ff99;border-color:#00ff99}
.modal-btn.danger{background:#ff4466;border-color:#ff4466;color:#fff}
.modal-btn.danger:hover{background:#ff5577;border-color:#ff5577}
.modal-error{color:#ff4466;font-size:11px;margin-bottom:10px;min-height:14px}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:0;padding:0;background:#000;border-top:1px solid #1a1a1a;opacity:0;pointer-events:none;transition:opacity 0.5s ease,transform 0.5s ease;z-index:100;direction:ltr;height:50px;transform:translateY(100%)}
.bottom-bar.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.tool-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 16px;background:transparent;border:none;cursor:pointer;transition:background 0.15s ease;flex:1;position:relative;min-width:80px;border-right:1px solid #1a1a1a}
.tool-btn:last-child{border-right:none}
.tool-btn:hover{background:#111}
.tool-btn.active{background:#111}
.tool-btn.active svg{stroke:#fff}
.tool-btn.active .label{color:#fff}
.tool-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.15s ease}
.tool-btn:hover svg{stroke:#fff}
.tool-btn .label{color:#fff;font-size:10px;font-weight:500;letter-spacing:0.3px;text-transform:uppercase;transition:color 0.15s ease;white-space:nowrap}
.tool-btn:hover .label{color:#fff}
.tool-btn .badge{position:absolute;top:6px;right:8px;min-width:16px;height:16px;padding:0 4px;background:#ff4466;color:#fff;font-size:9px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center}

@media (min-width: 769px){
  .bottom-bar{top:0;bottom:0;left:0;right:auto;width:56px;height:100%;flex-direction:column;border-top:none;border-right:1px solid #1a1a1a;transform:translateX(-100%);padding:8px 0}
  .bottom-bar.visible{transform:translateX(0)}
  .tool-btn{flex:none;width:100%;min-width:unset;height:56px;border-right:none;border-bottom:1px solid #1a1a1a;padding:0;gap:3px}
  .tool-btn:last-child{border-bottom:none}
  .tool-btn svg{width:20px;height:20px}
  .tool-btn .label{font-size:8px;letter-spacing:0.2px}
  .tool-btn .badge{top:4px;right:4px;min-width:14px;height:14px;font-size:8px}
  .chart-container{left:56px;width:calc(100% - 56px);height:100%}
  .top-controls{left:56px}
  .editor-page{left:56px;width:calc(100% - 56px);height:100%}
  .signals-page{left:56px;width:calc(100% - 56px);height:100%}
  .indicators-page{left:56px;width:calc(100% - 56px);height:100%}
}
@media (max-width: 768px){.editor-sidebar{width:180px}}
@media (max-width: 600px){
  .logo-container{width:360px;height:360px}
  .logo-container.expanded{transform:scale(1.8)}
  .chart-container{height:calc(100% - 50px)}
  .symbol-info{display:none}
  .tool-btn{padding:0 10px;min-width:60px}
  .tool-btn svg{width:16px;height:16px}
  .tool-btn .label{font-size:9px}
  .editor-sidebar{width:60px}
  .sidebar-header{font-size:9px;padding:10px 6px;text-align:center}
  .sidebar-item{padding:8px 4px;flex-direction:column;gap:3px;font-size:9px}
  .sidebar-item .item-name{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);max-height:60px}
  .sidebar-delete-btn{opacity:1!important}
  .editor-toolbar{padding:6px 8px;gap:4px;flex-wrap:wrap}
  .editor-btn{padding:5px 8px;font-size:11px}
  .editor-btn span.btn-text{display:none}
  .CodeMirror{font-size:11px !important}
  .signals-grid{grid-template-columns:1fr}
  .indicators-page-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .editor-side-btn{width:26px;height:26px}
  .editor-side-btn svg{width:12px;height:12px}
}
@media (max-width: 380px){
  .logo-container{width:300px;height:300px}
  .logo-container.expanded{transform:scale(1.6)}
  .editor-sidebar{display:none}
  .indicators-page-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="chart-container" id="chartContainer">
  <div id="tvChart"></div>
  <div class="floating-indicators" id="floatingIndicators">
    <div class="ind-list-wrapper" id="indListWrapper"></div>
    <button class="toggle-indicators-arrow" id="toggleIndicatorsArrow" title="Hide/Show indicators">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>
</div>

<div class="top-controls" id="topControls">
  <div class="top-bar">
    <div class="top-row">
      <button class="top-btn symbol-btn" id="symbolBtn">
        <span class="symbol-name" id="currentSymbol">BTC/USDT</span>
        <div class="symbol-info">
          <span class="symbol-price" id="currentPrice">67,234.50</span>
          <span class="symbol-change positive" id="currentChange">+2.45%</span>
        </div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="top-btn tf-btn" id="timeframeBtn">
        <span id="currentTimeframe">1m</span>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="tf-dropdown" id="tfDropdown">
  <div class="tf-dropdown-header">
    <div class="tf-dropdown-title">Timeframe</div>
    <button class="tf-dropdown-close" id="tfClose">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="tf-options-grid" id="tfOptionsGrid"></div>
</div>

<div class="overlay-menu" id="symbolMenu">
  <div class="overlay-header">
    <div class="overlay-top-row">
      <div class="overlay-title">Select Market</div>
      <button class="close-btn" data-close="symbolMenu">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="symbolSearch" placeholder="Search symbol..." autocomplete="off" spellcheck="false"/>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </div>
  </div>
  <div class="items-grid" id="symbolGrid"></div>
  <div class="no-results" id="noResults">No markets found</div>
</div>

<div class="signals-page" id="signalsPage">
  <div class="signals-header">
    <div class="signals-title">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>Trading Signals</span>
    </div>
    <div class="signals-count">3 Active</div>
  </div>
  <div class="signals-grid" id="signalsGrid"></div>
</div>

<div class="indicators-page" id="indicatorsPage">
  <div class="indicators-page-header">
    <div class="indicators-page-title">Indicators Library</div>
  </div>
  <div class="indicators-page-grid" id="indicatorsPageGrid"></div>
</div>

<div class="editor-page" id="editorPage">
  <div class="editor-toolbar">
    <div class="editor-toolbar-left">
      <button class="editor-btn" id="editorBack">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span class="btn-text">Back</span>
      </button>
      <div class="current-indicator-display" id="currentIndicatorDisplay">
        <span class="current-indicator-name" id="currentIndicatorName">Signals</span>
        <div class="current-indicator-actions">
          <button class="ci-action settings" id="ciSettings" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="ci-action delete" id="ciDelete" title="Remove">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="editor-toolbar-right">
      <button class="editor-btn" id="editorNew">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="btn-text">New</span>
      </button>
      <button class="editor-btn primary" id="editorRun">
        <svg class="run-icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg class="run-icon-stop" viewBox="0 0 24 24" style="display:none"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        <span class="btn-text run-label">Run</span>
      </button>
    </div>
  </div>
  <div class="indicators-list-wrapper" id="indicatorsListWrapper">
    <div class="indicators-list-header">
      <span class="indicators-list-title">All Indicators</span>
      <span class="indicators-list-count" id="indicatorsListCount">0</span>
    </div>
    <div class="indicators-list-body" id="indicatorsListBody"></div>
  </div>
  <button class="toggle-list-btn" id="toggleListBtn" title="Toggle indicators list">
    <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <div class="editor-body">
    <div class="editor-sidebar">
      <div class="sidebar-header">Indicators</div>
      <div class="sidebar-list" id="sidebarList"></div>
    </div>
    <div class="editor-main">
      <div class="code-wrapper">
        <textarea id="codeEditor"></textarea>
        <div class="editor-side-toolbar" id="editorSideToolbar">
          <button class="editor-side-btn" id="btnSelectAll" title="Select All">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16"/><path d="M9 4v16"/></svg>
            <span class="tooltip">Select All</span>
          </button>
          <button class="editor-side-btn" id="btnCopy" title="Copy">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span class="tooltip">Copy</span>
          </button>
          <button class="editor-side-btn" id="btnCut" title="Cut">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            <span class="tooltip">Cut</span>
          </button>
        </div>
      </div>
      <div class="editor-console" id="editorConsole">
        <div class="console-resize-handle" id="consoleResizeHandle"></div>
        <div class="console-header" id="consoleHeader">
          <div class="console-title">Console</div>
          <div class="console-header-actions">
            <button class="console-clear" id="consoleClear">Clear</button>
            <button class="console-close" id="consoleClose" title="Close console">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="console-output" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteConfirmModal">
  <div class="modal">
    <div class="modal-title">Delete Indicator</div>
    <div class="modal-desc" id="deleteConfirmDesc">Are you sure?</div>
    <div class="modal-actions">
      <button class="modal-btn" id="deleteCancelBtn">Cancel</button>
      <button class="modal-btn danger" id="deleteConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="newIndicatorModal">
  <div class="modal">
    <div class="modal-title">New Indicator</div>
    <div class="modal-desc">Enter a name for your custom indicator</div>
    <input type="text" class="modal-input" id="newIndicatorInput" placeholder="e.g. MyStrategy" autocomplete="off" spellcheck="false"/>
    <div class="modal-filename" id="newIndicatorFilename">File: untitled.js</div>
    <div class="modal-error" id="newIndicatorError"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="newIndicatorCancel">Cancel</button>
      <button class="modal-btn primary" id="newIndicatorContinue">Continue</button>
    </div>
  </div>
</div>

  <button class="tool-btn" data-page="chart">
    <svg viewBox="0 0 24 24"><line x1="5" y1="4" x2="5" y2="20" stroke-width="1.2"/><rect x="3.2" y="7" width="3.6" height="8" fill="#fff" stroke="none"/><line x1="12" y1="3" x2="12" y2="19" stroke-width="1.2"/><rect x="10.2" y="5" width="3.6" height="9" fill="#fff" stroke="none"/><line x1="19" y1="6" x2="19" y2="21" stroke-width="1.2"/><rect x="17.2" y="9" width="3.6" height="7" fill="#fff" stroke="none"/></svg>

var MA10_CODE="// Moving Average 10 (Yellow)\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  const period = 10;\n  if (data.length < period) return { plots: [] };\n  const result = [];\n  for (let i = period - 1; i < data.length; i++) {\n    let sum = 0;\n    for (let j = 0; j < period; j++) sum += data[i - j].close;\n    result.push({ time: data[i].time, value: sum / period });\n  }\n  return { plots: [{ type: 'line', name: 'MA 10', data: result, color: '#ffc452', width: 1 }] };\n}";
var MA20_CODE="// Moving Average 20 (Purple)\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  const period = 20;\n  if (data.length < period) return { plots: [] };\n  const result = [];\n  for (let i = period - 1; i < data.length; i++) {\n    let sum = 0;\n    for (let j = 0; j < period; j++) sum += data[i - j].close;\n    result.push({ time: data[i].time, value: sum / period });\n  }\n  return { plots: [{ type: 'line', name: 'MA 20', data: result, color: '#ab82ff', width: 1 }] };\n}";
var SIGNALS_EXAMPLE_CODE="// Trading Signals Indicator\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  const lookback = 3;\n  if (data.length < lookback * 2 + 1) return { plots: [] };\n  const markers = [], trendLine = [];\n  for (let i = lookback; i < data.length - lookback; i++) {\n    const curr = data[i];\n    if (!curr || curr.close === undefined) continue;\n    let isSwingLow = true;\n    for (let j = 1; j <= lookback; j++) { if (!data[i-j] || !data[i+j] || data[i-j].low < curr.low || data[i+j].low < curr.low) { isSwingLow = false; break; } }\n    let isSwingHigh = true;\n    for (let j = 1; j <= lookback; j++) { if (!data[i-j] || !data[i+j] || data[i-j].high > curr.high || data[i+j].high > curr.high) { isSwingHigh = false; break; } }\n    if (isSwingLow) markers.push({ time: curr.time, position: 'belowBar', color: '#00ff88', shape: 'arrowUp', text: 'BUY' });\n    if (isSwingHigh) markers.push({ time: curr.time, position: 'aboveBar', color: '#ff4466', shape: 'arrowDown', text: 'SELL' });\n    let sum = 0, count = 0;\n    for (let j = 0; j < 5 && i-j >= 0; j++) { if (data[i-j] && data[i-j].close !== undefined) { sum += data[i-j].close; count++; } }\n    if (count > 0) trendLine.push({ time: curr.time, value: sum / count });\n  }\n  markers.sort((a, b) => a.time - b.time);\n  return { plots: [\n    { type: 'line', name: 'SMA 5', data: trendLine, color: '#00bfff', width: 1 },\n    { type: 'markers', name: 'Signals', data: markers }\n  ]};\n}";
var DEFAULT_INDICATOR_CODE="// Custom Indicator\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  const period = 14;\n  if (data.length < period) return { plots: [] };\n  const upper = [], middle = [], lower = [];\n  for (let i = period - 1; i < data.length; i++) {\n    let sum = 0, count = 0;\n    for (let j = 0; j < period; j++) { if (data[i-j] && data[i-j].close !== undefined) { sum += data[i-j].close; count++; } }\n    if (count === 0) continue;\n    const avg = sum / count;\n    let variance = 0;\n    for (let j = 0; j < period; j++) { if (data[i-j] && data[i-j].close !== undefined) { const diff = data[i-j].close - avg; variance += diff * diff; } }\n    const std = Math.sqrt(variance / count);\n    middle.push({ time: data[i].time, value: avg });\n    upper.push({ time: data[i].time, value: avg + 2 * std });\n    lower.push({ time: data[i].time, value: avg - 2 * std });\n  }\n  return { plots: [\n    { type: 'line', name: 'Upper Band', data: upper, color: '#00ff88', width: 1, lineStyle: 1 },\n    { type: 'line', name: 'Middle (SMA)', data: middle, color: '#00bfff', width: 2 },\n    { type: 'line', name: 'Lower Band', data: lower, color: '#ff4466', width: 1, lineStyle: 1 },\n    { type: 'fill', name: 'Channel Fill', upperData: upper, lowerData: lower, color: 'rgba(0,191,255,0.08)' }\n  ]};\n}";

function createFillOverlay(plot,indicator){var chartContainer=document.getElementById('tvChart');var canvas=document.createElement('canvas');canvas.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:2;';chartContainer.style.position='relative';chartContainer.appendChild(canvas);var ctx=canvas.getContext('2d');var upperData=plot.upperData||[],lowerData=plot.lowerData||[];var fillColor=plot.color||'rgba(0,191,255,0.15)';var upperLine=chart.addLineSeries({color:'transparent',lineWidth:0,crosshairMarkerVisible:false,priceLineVisible:false,lastValueVisible:false});var lowerLine=chart.addLineSeries({color:'transparent',lineWidth:0,crosshairMarkerVisible:false,priceLineVisible:false,lastValueVisible:false});upperLine.setData(upperData);lowerLine.setData(lowerData);function resizeCanvas(){canvas.width=chartContainer.clientWidth;canvas.height=chartContainer.clientHeight;drawFill();}function drawFill(){ctx.clearRect(0,0,canvas.width,canvas.height);if(upperData.length===0||lowerData.length===0)return;ctx.fillStyle=fillColor;ctx.beginPath();var upperPoints=[],lowerPoints=[];for(var i=0;i<upperData.length;i++){var x=chart.timeScale().timeToCoordinate(upperData[i].time),y=upperLine.priceToCoordinate(upperData[i].value);if(x!==null&&y!==null)upperPoints.push({x:x,y:y});}for(var i=0;i<lowerData.length;i++){var x=chart.timeScale().timeToCoordinate(lowerData[i].time),y=lowerLine.priceToCoordinate(lowerData[i].value);if(x!==null&&y!==null)lowerPoints.push({x:x,y:y});}if(upperPoints.length<2||lowerPoints.length<2)return;ctx.moveTo(upperPoints[0].x,upperPoints[0].y);for(var i=1;i<upperPoints.length;i++)ctx.lineTo(upperPoints[i].x,upperPoints[i].y);for(var i=lowerPoints.length-1;i>=0;i--)ctx.lineTo(lowerPoints[i].x,lowerPoints[i].y);ctx.closePath();ctx.fill();}var timeRangeUnsub=chart.timeScale().subscribeVisibleTimeRangeChange(drawFill);var mouseMoveHandler=function(){requestAnimationFrame(drawFill);};chartContainer.addEventListener('mousemove',mouseMoveHandler);chartContainer.addEventListener('wheel',function(){setTimeout(drawFill,50);});window.addEventListener('resize',resizeCanvas);resizeCanvas();return{type:'fill',canvas:canvas,upperLine:upperLine,lowerLine:lowerLine,remove:function(){canvas.remove();try{chart.removeSeries(upperLine);}catch(e){}try{chart.removeSeries(lowerLine);}catch(e){}window.removeEventListener('resize',resizeCanvas);chartContainer.removeEventListener('mousemove',mouseMoveHandler);try{timeRangeUnsub();}catch(e){}},update:function(nU,nL){upperData=nU;lowerData=nL;upperLine.setData(nU);lowerLine.setData(nL);drawFill();},setVisible:function(v){canvas.style.display=v?'block':'none';}};}

document.getElementById('newIndicatorContinue').addEventListener('click',confirmNewIndicator);
newIndicatorModal.addEventListener('click',function(e){if(e.target===newIndicatorModal)closeNewIndicatorModal();});
function confirmNewIndicator(){var val=newIndicatorInput.value.trim(),sanitized=val.replace(/[^a-zA-Z0-9_\-]/g,'');if(!sanitized){newIndicatorError.textContent='Please enter a valid name';return;}if(indicators.some(function(ind){return ind.name.toLowerCase()===sanitized.toLowerCase();})){newIndicatorError.textContent='An indicator with this name already exists';return;}createIndicator(sanitized,DEFAULT_INDICATOR_CODE);closeNewIndicatorModal();}

// ==================== LOGO TRANSITION (CSS animations handle the drawing) ====================
(function(){
  var logoContainer=document.querySelector('.logo-container');
  var bottomBar=document.getElementById('bottomBar');
  var chartContainer=document.getElementById('chartContainer');
  var topControls=document.getElementById('topControls');

  // CSS animations run for 2s, then we transition
  setTimeout(function(){
    logoContainer.classList.add('expanded');
    setTimeout(function(){
      chartContainer.classList.add('visible');
      topControls.classList.add('visible');
      bottomBar.classList.add('visible');
      navigateTo('chart');
    },1200);
  },2200);
})();

// ==================== INIT ====================
initCodeMirror();
createIndicator('MA 10',MA10_CODE);
createIndicator('MA 20',MA20_CODE);
createIndicator('Signals',SIGNALS_EXAMPLE_CODE);
updateIndicatorsList();
updateFloatingIndicators();
updateCurrentIndicatorDisplay();
</script>
