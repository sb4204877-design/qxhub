<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QXTerminal Logo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:monospace}

.logo-container{
  width:380px;height:380px;position:relative;z-index:5;
  transition:transform 3s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.5s ease, z-index 0.3s ease 2.5s;
}
.logo-container svg{width:100%;height:100%;overflow:visible;display:block}
.logo-container.expanded{
  transform:scale(1.8);
  opacity:0.25;
  z-index:0;
  pointer-events:none;
}

.hexagon-border{fill:none;stroke:url(#cyanGrad);stroke-width:9;stroke-linecap:butt;stroke-linejoin:round}
.hexagon{fill:none;stroke:url(#blueGrad);stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}

.bar{fill:#000;stroke:url(#cyanGrad);stroke-width:3;stroke-linejoin:round;transform-box:fill-box;transform-origin:center bottom;opacity:0}

.notch-fill{fill:none;stroke:url(#cyanGrad);stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter}
.notch-fill-inner{fill:none;stroke:url(#blueGrad);stroke-width:3;stroke-linecap:butt;stroke-linejoin:miter}

.trend-line{fill:none;stroke:url(#cyanGrad);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.trend-area{fill:url(#areaGrad);opacity:0}
.trend-dot{fill:#00f0ff;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.trend-arrow{fill:#00f0ff;opacity:0}

.chart-container{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:calc(100% - 58px);
  z-index:1;
  opacity:0;
  transition:opacity 1.5s ease;
}
.chart-container.visible{
  opacity:1;
  pointer-events:auto;
}
#tvChart{width:100%;height:100%;touch-action:none}

.top-controls{
  position:fixed;
  top:15px;
  left:15px;
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:8px;
  opacity:0;
  transform:translateY(-20px);
  transition:opacity 1s ease, transform 1s ease;
  pointer-events:none;
  direction:ltr;
  max-width:calc(100% - 30px);
}
.top-controls.visible{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.top-row{
  display:flex;
  gap:8px;
  align-items:flex-start;
}

.top-btn{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  background:rgba(10,20,35,0.6);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(0,210,255,0.2);
  border-radius:10px;
  color:#00d2ff;
  font-family:monospace;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
}
.top-btn:hover{
  background:rgba(0,210,255,0.1);
  border-color:rgba(0,210,255,0.5);
  color:#00f0ff;
}
.top-btn svg{
  width:12px;height:12px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform 0.3s ease;
}
.top-btn.open svg.chevron{
  transform:rotate(180deg);
}

.symbol-btn{
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  padding:6px 14px;
}
.symbol-main{
  display:flex;
  align-items:center;
  gap:8px;
}
.symbol-price{
  color:#00f0ff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:0.5px;
  font-family:monospace;
}
.symbol-change{
  font-size:10px;
  font-weight:bold;
  font-family:monospace;
  padding:1px 5px;
  border-radius:3px;
}
.symbol-change.positive{
  color:#00ff88;
  background:rgba(0,255,136,0.1);
}
.symbol-change.negative{
  color:#ff4466;
  background:rgba(255,68,102,0.1);
}

.live-dot{
  display:inline-block;
  width:5px;height:5px;
  background:#00ff88;
  border-radius:50%;
  animation:blink 1.5s infinite;
  box-shadow:0 0 6px #00ff88;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0.3}
}

/* ============ ACTIVE INDICATORS BAR ============ */
.active-indicators-bar{
  display:flex;
  flex-direction:column;
  gap:4px;
  max-width:100%;
}
.ind-list-wrapper{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  max-height:500px;
  overflow:hidden;
  transition:max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
  opacity:1;
}
.ind-list-wrapper.hidden{
  max-height:0;
  opacity:0;
  pointer-events:none;
}

.active-indicator-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:3px 6px 3px 8px;
  background:transparent;
  border:none;
  border-radius:0;
  transition:all 0.25s ease;
  direction:ltr;
}
.active-indicator-item:hover{
  background:rgba(10,20,35,0.5);
  border-radius:6px;
}
.active-indicator-item.hidden-ind{
  opacity:0.4;
}
.active-indicator-item.hidden-ind .ind-item-name{
  text-decoration:line-through;
  color:rgba(0,210,255,0.4);
}
.ind-item-color{
  width:8px;height:8px;
  border-radius:50%;
  flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.ind-item-name{
  color:#00d2ff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:0.5px;
  font-family:monospace;
  white-space:nowrap;
}
.ind-item-actions{
  display:flex;
  gap:2px;
  margin-left:2px;
}
.ind-item-action{
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  border:none;
  border-radius:4px;
  color:rgba(0,210,255,0.5);
  cursor:pointer;
  transition:all 0.2s ease;
  padding:0;
}
.ind-item-action svg{
  width:12px;height:12px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.ind-item-action:hover{
  background:rgba(0,210,255,0.12);
  color:#00f0ff;
}
.ind-item-action.delete:hover{
  background:rgba(255,68,102,0.15);
  color:#ff4466;
}

/* Toggle arrow - NO border */
.toggle-indicators-arrow{
  width:28px;
  height:14px;
  background:transparent;
  border:none;
  color:rgba(0,210,255,0.5);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.25s ease;
  padding:0;
  margin-top:-2px;
  align-self:flex-start;
}
.toggle-indicators-arrow:hover{
  color:#00f0ff;
}
.toggle-indicators-arrow svg{
  width:12px;height:12px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform 0.3s ease;
}
.toggle-indicators-arrow.collapsed svg{
  transform:rotate(180deg);
}

.overlay-menu{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,5,15,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
  overflow-y:auto;
  padding:30px 30px 90px;
}
.overlay-menu.visible{
  opacity:1;
  pointer-events:auto;
}

.overlay-header{
  max-width:1200px;
  margin:0 auto 20px;
}

.overlay-top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.overlay-title{
  color:#00f0ff;
  font-size:16px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase;
  font-family:monospace;
}
.close-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  border:1px solid rgba(0,210,255,0.2);
  border-radius:50%;
  color:#00d2ff;
  cursor:pointer;
  transition:all 0.3s ease;
}
.close-btn:hover{
  background:rgba(0,210,255,0.1);
  border-color:#00f0ff;
  color:#00f0ff;
  transform:rotate(90deg);
}
.close-btn svg{
  width:16px;height:16px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
}

.search-box{
  position:relative;
  width:100%;
}
.search-box svg{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:16px;height:16px;
  stroke:rgba(0,210,255,0.5);
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  pointer-events:none;
  transition:stroke 0.3s ease;
}
.search-input{
  width:100%;
  padding:12px 16px 12px 42px;
  background:rgba(10,20,35,0.6);
  border:1px solid rgba(0,210,255,0.2);
  border-radius:10px;
  color:#00f0ff;
  font-family:monospace;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
  outline:none;
  transition:all 0.3s ease;
  direction:ltr;
}
.search-input::placeholder{
  color:rgba(0,210,255,0.35);
  font-weight:normal;
  letter-spacing:0.5px;
}
.search-input:focus{
  background:rgba(10,20,35,0.8);
  border-color:rgba(0,210,255,0.5);
  box-shadow:0 0 0 3px rgba(0,210,255,0.08);
}
.search-input:focus + svg{
  stroke:#00f0ff;
}

.no-results{
  text-align:center;
  padding:40px 20px;
  color:rgba(0,210,255,0.4);
  font-family:monospace;
  font-size:13px;
  letter-spacing:1px;
  display:none;
}
.no-results.visible{
  display:block;
}

.items-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
  gap:12px;
  max-width:1200px;
  margin:0 auto;
}

.item-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  background:rgba(10,20,35,0.6);
  border:1px solid rgba(0,210,255,0.12);
  border-radius:10px;
  cursor:pointer;
  transition:all 0.3s ease;
  opacity:0;
  transform:translateY(15px);
  animation:cardIn 0.4s forwards;
}
.item-card:hover{
  background:rgba(0,210,255,0.08);
  border-color:rgba(0,210,255,0.4);
  transform:translateY(-2px);
  box-shadow:0 4px 20px rgba(0,210,255,0.15);
}
.item-card.active{
  border-color:rgba(0,240,255,0.5);
  background:rgba(0,210,255,0.08);
}
.item-card.active .item-symbol{
  color:#00f0ff;
}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}

.item-symbol{
  color:#00d2ff;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
  font-family:monospace;
}
.item-change{
  font-size:11px;
  font-family:monospace;
  font-weight:bold;
}
.item-change.positive{color:#00ff88}
.item-change.negative{color:#ff4466}

.tf-dropdown{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0.9);
  min-width:240px;
  background:rgba(10,20,35,0.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(0,210,255,0.25);
  border-radius:14px;
  padding:10px;
  opacity:0;
  pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index:70;
  box-shadow:0 12px 50px rgba(0,0,0,0.6), 0 0 30px rgba(0,210,255,0.08);
}
.tf-dropdown.visible{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%, -50%) scale(1);
}
.tf-dropdown-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 10px 12px;
  margin-bottom:6px;
  border-bottom:1px solid rgba(0,210,255,0.15);
}
.tf-dropdown-title{
  color:#00f0ff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-family:monospace;
}
.tf-dropdown-close{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  border:1px solid rgba(0,210,255,0.2);
  border-radius:50%;
  color:#00d2ff;
  cursor:pointer;
  transition:all 0.3s ease;
}
.tf-dropdown-close:hover{
  background:rgba(0,210,255,0.1);
  border-color:#00f0ff;
  color:#00f0ff;
  transform:rotate(90deg);
}
.tf-dropdown-close svg{
  width:10px;height:10px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.5;
  stroke-linecap:round;
}
.tf-options-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:6px;
}
.tf-option{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:10px 12px;
  color:#00d2ff;
  font-family:monospace;
  font-size:14px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:8px;
  border:1px solid rgba(0,210,255,0.1);
  transition:all 0.2s ease;
}
.tf-option:hover{
  background:rgba(0,210,255,0.1);
  border-color:rgba(0,210,255,0.4);
  color:#00f0ff;
  transform:translateY(-1px);
}
.tf-option.active{
  background:rgba(0,210,255,0.12);
  border-color:rgba(0,240,255,0.5);
  color:#00f0ff;
}
.tf-option .tf-label{
  font-size:9px;
  color:rgba(0,210,255,0.5);
  font-weight:normal;
  letter-spacing:0.5px;
}

/* ============ EDITOR PAGE ============ */
.editor-page{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:#0d1117;
  z-index:80;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
  display:flex;
  flex-direction:column;
}
.editor-page.visible{
  opacity:1;
  pointer-events:auto;
}

.editor-toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  background:rgba(13,17,23,0.98);
  border-bottom:1px solid rgba(0,210,255,0.15);
  flex-shrink:0;
  direction:ltr;
}
.editor-toolbar-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
}
.editor-toolbar-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.current-indicator-display{
  display:flex;
  align-items:center;
  gap:8px;
  padding:4px 10px;
  background:rgba(0,210,255,0.06);
  border:1px solid rgba(0,210,255,0.15);
  border-radius:6px;
  min-width:0;
  max-width:260px;
}
.current-indicator-name{
  color:#00f0ff;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  font-family:monospace;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.current-indicator-actions{
  display:flex;
  gap:3px;
  flex-shrink:0;
}
.ci-action{
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  border:none;
  border-radius:4px;
  color:rgba(0,210,255,0.6);
  cursor:pointer;
  transition:all 0.2s ease;
  padding:0;
}
.ci-action svg{
  width:13px;height:13px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.ci-action:hover{
  background:rgba(0,210,255,0.12);
  color:#00f0ff;
}
.ci-action.delete:hover{
  background:rgba(255,68,102,0.15);
  color:#ff4466;
}

.editor-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 14px;
  background:transparent;
  border:1px solid rgba(0,210,255,0.2);
  border-radius:8px;
  color:#00d2ff;
  font-family:monospace;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.25s ease;
}
.editor-btn svg{
  width:13px;height:13px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.editor-btn:hover{
  background:rgba(0,210,255,0.1);
  border-color:rgba(0,210,255,0.5);
  color:#00f0ff;
}

.editor-btn.primary{
  background:rgba(0,255,136,0.1);
  border-color:rgba(0,255,136,0.3);
  color:#00ff88;
}
.editor-btn.primary:hover{
  background:rgba(0,255,136,0.18);
  border-color:rgba(0,255,136,0.6);
  color:#00ff88;
  box-shadow:0 0 15px rgba(0,255,136,0.2);
}
.editor-btn.primary:active{
  transform:scale(0.96);
}
.editor-btn.primary.running{
  background:rgba(255,68,102,0.15);
  border-color:rgba(255,68,102,0.5);
  color:#ff4466;
  box-shadow:0 0 15px rgba(255,68,102,0.3);
}
.editor-btn.primary.running:hover{
  background:rgba(255,68,102,0.25);
  border-color:rgba(255,68,102,0.7);
  color:#ff6680;
  box-shadow:0 0 20px rgba(255,68,102,0.4);
}

/* ============ INDICATORS LIST ============ */
.indicators-list-wrapper{
  background:rgba(8,14,24,0.95);
  border-bottom:1px solid rgba(0,210,255,0.1);
  flex-shrink:0;
  direction:ltr;
  overflow:hidden;
  transition:max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  max-height:200px;
}
.indicators-list-wrapper.collapsed{
  max-height:0;
  border-bottom-color:transparent;
}

.indicators-list-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  border-bottom:1px solid rgba(0,210,255,0.08);
}
.indicators-list-title{
  color:rgba(0,210,255,0.5);
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-family:monospace;
}
.indicators-list-count{
  color:rgba(0,210,255,0.4);
  font-size:10px;
  font-family:monospace;
}
.indicators-list-body{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px 14px 12px;
  max-height:140px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(0,210,255,0.2) transparent;
}
.indicators-list-body::-webkit-scrollbar{height:4px;width:4px}
.indicators-list-body::-webkit-scrollbar-track{background:transparent}
.indicators-list-body::-webkit-scrollbar-thumb{background:rgba(0,210,255,0.2);border-radius:2px}

.ind-list-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  background:rgba(0,210,255,0.04);
  border:1px solid rgba(0,210,255,0.1);
  border-radius:6px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.ind-list-item:hover{
  background:rgba(0,210,255,0.08);
  border-color:rgba(0,210,255,0.25);
}
.ind-list-item.active{
  background:rgba(0,210,255,0.1);
  border-color:rgba(0,240,255,0.4);
}
.ind-list-item.active .ind-list-name{
  color:#00f0ff;
}
.ind-list-item.hidden-ind{
  opacity:0.5;
}
.ind-list-item.hidden-ind .ind-list-name{
  text-decoration:line-through;
}
.ind-list-color{
  width:6px;height:6px;
  border-radius:50%;
  flex-shrink:0;
}
.ind-list-name{
  color:#00d2ff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:0.5px;
  font-family:monospace;
  white-space:nowrap;
}
.ind-list-status{
  width:5px;height:5px;
  border-radius:50%;
  background:#00ff88;

.toggle-list-btn{

.editor-body{

.editor-sidebar{

.sidebar-list{

}

}

.editor-main{

.code-wrapper{

/* ============ RESIZABLE CONSOLE ============ */
.editor-console{
  height:0;
  background:rgba(5,12,22,0.95);
  border-top:1px solid rgba(0,210,255,0.15);
  overflow:hidden;
  transition:height 0.3s ease;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  position:relative;
}
.editor-console.visible{
  height:var(--console-height, 140px);
}
.console-resize-handle{
  position:absolute;
  top:-4px;
  left:0;
  width:100%;
  height:8px;
  background:transparent;
  cursor:ns-resize;
  z-index:10;
  transition:background 0.2s ease;
}
.console-resize-handle:hover,
.console-resize-handle.dragging{
  background:rgba(0,210,255,0.15);
}
.console-resize-handle::after{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:40px;
  height:2px;
  background:rgba(0,210,255,0.3);
  border-radius:1px;
  opacity:0;
  transition:opacity 0.2s ease;
}
.console-resize-handle:hover::after,
.console-resize-handle.dragging::after{
  opacity:1;
}
.console-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 12px;
  border-bottom:1px solid rgba(0,210,255,0.1);
  flex-shrink:0;
}
.console-title{
  color:#00f0ff;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-family:monospace;
}
.console-clear{
  background:transparent;
  border:none;
  color:rgba(0,210,255,0.5);
  font-family:monospace;
  font-size:10px;
  cursor:pointer;
  padding:2px 8px;
  border-radius:4px;
  transition:all 0.2s ease;
}
.console-clear:hover{
  color:#00f0ff;
  background:rgba(0,210,255,0.08);
}
.console-output{
  flex:1;
  overflow-y:auto;
  padding:8px 12px;
  font-family:monospace;
  font-size:11px;
  color:#00d2ff;
  line-height:1.5;
}
.console-line{
  padding:2px 0;
  display:flex;
  gap:8px;
}
.console-line .prefix{
  color:rgba(0,210,255,0.4);
  flex-shrink:0;
}
.console-line.error .prefix{color:#ff4466}
.console-line.error .msg{color:#ff4466}
.console-line.success .prefix{color:#00ff88}
.console-line.success .msg{color:#00ff88}
.console-line.info .msg{color:#00d2ff}

/* ============ SIGNALS PAGE ============ */
.signals-page{

  overflow-y:auto;
  padding:30px 30px 90px;

}
.signals-page.visible{

  pointer-events:auto;
}
.signals-header{

}
.signals-title{

.signal-card{

}
.signal-symbol{

.signal-type{

}
.signal-type.buy{

}
.signal-type.sell{
  background:rgba(255,68,102,0.12);

  border:1px solid rgba(255,68,102,0.3);
}
.signal-details{
  display:flex;
  flex-direction:column;

  font-family:monospace;

}
.signal-row{

.signal-time{

.modal-overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}
.modal-overlay.visible{
  opacity:1;
  pointer-events:auto;
}
.modal{
  width:90%;
  max-width:420px;
  background:rgba(10,20,35,0.98);
  border:1px solid rgba(0,210,255,0.3);
  border-radius:14px;
  padding:24px;
  transform:scale(0.9) translateY(20px);
  transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(0,210,255,0.1);
}
.modal-overlay.visible .modal{
  transform:scale(1) translateY(0);
}
.modal-title{
  color:#00f0ff;
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase;
  font-family:monospace;
  margin-bottom:6px;
}
.modal-desc{
  color:rgba(0,210,255,0.5);
  font-size:11px;
  font-family:monospace;
  margin-bottom:18px;
  letter-spacing:0.5px;
}
.modal-input{
  width:100%;
  padding:12px 14px;
  background:rgba(0,10,20,0.6);
  border:1px solid rgba(0,210,255,0.2);
  border-radius:8px;
  color:#00f0ff;
  font-family:monospace;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
  outline:none;
  transition:all 0.3s ease;
  margin-bottom:6px;
  direction:ltr;
  text-align:left;
}
.modal-input:focus{
  border-color:rgba(0,210,255,0.5);
  box-shadow:0 0 0 3px rgba(0,210,255,0.08);
}
.modal-input::placeholder{
  color:rgba(0,210,255,0.3);
  font-weight:normal;
}
.modal-filename{
  color:rgba(0,210,255,0.4);
  font-size:10px;
  font-family:monospace;
  margin-bottom:18px;
  letter-spacing:0.5px;
  direction:ltr;
  text-align:left;
}
.modal-actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
}
.modal-btn{
  padding:8px 18px;
  background:transparent;
  border:1px solid rgba(0,210,255,0.2);
  border-radius:8px;
  color:#00d2ff;
  font-family:monospace;
  font-size:11px;
  font-weight:bold;

}
.modal-btn:hover{

  color:#00f0ff;
}
.modal-btn.primary{

}
.modal-btn.primary:hover{

.modal-error{

  font-size:10px;
  font-family:monospace;
  margin-bottom:10px;

/* Bottom dock bar - BIGGER for mobile */
.bottom-bar{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  display:flex;
  gap:16px;
  padding:8px 36px;
  background:rgba(10,20,35,0.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(0,210,255,0.18);
  border-radius:24px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index:100;
  direction:ltr;
  width:560px;
  justify-content:space-around;
  align-items:center;
}
.bottom-bar.visible{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}

.tool-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:8px 18px;
  background:transparent;
  border:none;
  border-radius:14px;
  cursor:pointer;
  transition:all 0.3s ease;
  min-width:90px;
  flex:1;
  position:relative;
}
.tool-btn:hover{
  background:rgba(0,210,255,0.08);
  transform:translateY(-2px);
}
.tool-btn.active{
  background:rgba(0,210,255,0.12);
}
.tool-btn.active svg{
  stroke:#00f0ff;
  filter:drop-shadow(0 0 4px rgba(0,240,255,0.5));
}
.tool-btn.active .label{
  color:#00f0ff;
}
.tool-btn svg{
  width:22px;height:22px;
  stroke:#00d2ff;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
  transition:all 0.3s ease;
}
.tool-btn:hover svg{
  stroke:#00f0ff;
}
.tool-btn .label{
  color:#00d2ff;
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-family:monospace;
  transition:color 0.3s ease;
  white-space:nowrap;
}
.tool-btn:hover .label{
  color:#00f0ff;
}
.tool-btn .badge{
  position:absolute;
  top:2px;
  right:20px;
  min-width:16px;
  height:16px;
  padding:0 5px;
  background:#ff4466;
  color:#fff;
  font-size:9px;
  font-weight:bold;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:monospace;
  box-shadow:0 0 8px rgba(255,68,102,0.6);
  animation:badgePulse 2s infinite;
}
@keyframes badgePulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.1)}
}

/* Responsive */
@media (max-width: 768px) {
  .editor-sidebar{width:180px}
}

  .logo-container{width:300px;height:300px}
  .logo-container.expanded{transform:scale(1.5)}
  .chart-container{height:calc(100% - 60px)}
  .bottom-bar{
    gap:8px;
    padding:8px 18px;
    border-radius:20px;
    bottom:8px;
    width:calc(100% - 20px);
    max-width:560px;
  }
  .tool-btn{
    min-width:70px;
    padding:6px 10px;
    gap:3px;
  }
  .tool-btn svg{width:20px;height:20px}
  .tool-btn .label{font-size:10px;letter-spacing:1px}
  .top-controls{top:10px;left:10px;gap:8px}
  .top-btn{padding:7px 12px;font-size:11px}
  .overlay-menu{padding:20px 15px 80px}
  .overlay-title{font-size:14px}
  .search-input{padding:10px 14px 10px 38px;font-size:12px}
  .items-grid{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:8px}
  .item-card{padding:10px 12px}
  .item-symbol{font-size:12px}
  .symbol-price{font-size:10px}
  .tf-dropdown{min-width:220px}
  .tf-option{font-size:13px;padding:8px 10px}
  
  .editor-sidebar{width:60px}
  .sidebar-header{font-size:8px;padding:10px 6px;text-align:center}
  .sidebar-item{padding:8px 4px;flex-direction:column;gap:3px;font-size:8px}
  .sidebar-item .item-name{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);max-height:60px}
  .editor-toolbar{padding:8px 10px;gap:6px;flex-wrap:wrap}
  .editor-btn{padding:6px 10px;font-size:10px}
  .editor-btn span.btn-text{display:none}
  .CodeMirror{font-size:11px !important}
  .signals-grid{grid-template-columns:1fr}
  .indicators-page-grid{grid-template-columns:repeat(auto-fill, minmax(180px, 1fr))}

var SIGNALS_EXAMPLE_CODE = 
`// Trading Signals Indicator
// Detects local swing highs/lows and draws buy/sell markers on candles

function main(data) {
  const lookback = 3;
  const markers = [];
  
  for (let i = lookback; i < data.length - lookback; i++) {
    const curr = data[i];
    
    // Detect swing low (buy signal)
    let isSwingLow = true;
    for (let j = 1; j <= lookback; j++) {
      if (data[i - j].low < curr.low || data[i + j].low < curr.low) {
        isSwingLow = false;
        break;
      }
    }
    
    // Detect swing high (sell signal)
    let isSwingHigh = true;
    for (let j = 1; j <= lookback; j++) {
      if (data[i - j].high > curr.high || data[i + j].high > curr.high) {
        isSwingHigh = false;
        break;
      }
    }
    
    if (isSwingLow) {
      markers.push({
        time: curr.time,
        position: 'belowBar',
        color: '#00ff88',
        shape: 'arrowUp',
        text: 'BUY'
      });
    }
    
    if (isSwingHigh) {
      markers.push({
        time: curr.time,
        position: 'aboveBar',
        color: '#ff4466',
        shape: 'arrowDown',
        text: 'SELL'
      });
    }
  }
  
  // Sort markers by time (required by lightweight-charts)
  markers.sort((a, b) => a.time - b.time);
  
  return {
    type: 'markers',
    data: markers
  };
}`;

var DEFAULT_INDICATOR_CODE = 
`// Custom Indicator Template
// Available: data (array of {time, open, high, low, close, volume})
// Return: { type: 'line', data: [{time, value}], color: '#ff00ff' }
// Or:     { type: 'markers', data: [{time, position, shape, color, text}] }
// Or:     { type: 'histogram', data: [{time, value, color}] }

function main(data) {
  const period = 14;
  const result = [];
  
  for (let i = period - 1; i < data.length; i++) {
    let sum = 0;
    for (let j = 0; j < period; j++) {
      sum += data[i - j].close;
    }
    result.push({
      time: data[i].time,
      value: sum / period
    });
  }
  
  return {
    type: 'line',
    data: result,
    color: '#ff00ff',
    lineWidth: 2,
    title: 'MA ' + period
  };
}`;

function formatPrice(p) {
  if (p >= 1000) return p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (p >= 1) return p.toFixed(2);
  return p.toFixed(4);
}

function updateSymbolDisplay() {
  var sym = null;
  for (var i = 0; i < SYMBOLS.length; i++) {
    if (SYMBOLS[i].symbol === currentSymbol) { sym = SYMBOLS[i]; break; }
  }
  if (!sym) sym = SYMBOLS[0];
  document.getElementById('currentSymbol').textContent = sym.symbol;
  document.getElementById('currentPrice').textContent = formatPrice(sym.price);
  var changeEl = document.getElementById('currentChange');
  changeEl.textContent = (sym.change >= 0 ? '+' : '') + sym.change.toFixed(2) + '%';
  changeEl.className = 'symbol-change ' + (sym.change >= 0 ? 'positive' : 'negative');
}

function buildSymbolGrid() {
  var grid = document.getElementById('symbolGrid');
  var noResults = document.getElementById('noResults');
  grid.innerHTML = '';
  
  var query = searchQuery.trim().toUpperCase();
  var filtered = SYMBOLS.filter(function(s) {
    if (!query) return true;
    return s.symbol.toUpperCase().indexOf(query) !== -1;
  });
  
  if (filtered.length === 0) {
    noResults.classList.add('visible');
    return;
  } else {
    noResults.classList.remove('visible');
  }
  
  filtered.forEach(function(s, i) {
    var card = document.createElement('div');
    card.className = 'item-card' + (s.symbol === currentSymbol ? ' active' : '');
    card.style.animationDelay = (i * 0.03) + 's';
    card.innerHTML = 
      '<span class="item-symbol">' + s.symbol + '</span>' +
      '<span class="item-change ' + (s.change >= 0 ? 'positive' : 'negative') + '">' +
        (s.change >= 0 ? '+' : '') + s.change.toFixed(2) + '%' +
      '</span>';
    card.addEventListener('click', function() {
      currentSymbol = s.symbol;
      updateSymbolDisplay();
      refreshChart();
      closeAllMenus();
    });
    grid.appendChild(card);
  });
}

function buildTfDropdown() {
  var grid = document.getElementById('tfOptionsGrid');

    opt.className = 'tf-option' + (t.tf === currentTimeframe ? ' active' : '');
    opt.innerHTML = '<span>' + t.tf + '</span><span class="tf-label">' + t.label + '</span>';
    opt.addEventListener('click', function(e) {
      e.stopPropagation();
      currentTimeframe = t.tf;
      document.getElementById('currentTimeframe').textContent = t.tf;
      refreshChart();
      closeAllMenus();
    });
    grid.appendChild(opt);
  });
}

function generateCandleData(numCandles, basePrice, volatility, intervalSeconds) {
  var data = [];
  var price = basePrice;
  var now = Math.floor(Date.now() / 1000);
  var startTime = now - numCandles * intervalSeconds;
  
  for (var i = 0; i < numCandles; i++) {
    var time = startTime + i * intervalSeconds;
    var trendBias = Math.sin(i / 25) * 0.5 + Math.sin(i / 80) * 0.3 + 0.05;
    var change = (Math.random() - 0.5 + trendBias * 0.1) * volatility;
    var open = price;
    var close = price + change;
    var high = Math.max(open, close) + Math.random() * volatility * 0.7;
    var low = Math.min(open, close) - Math.random() * volatility * 0.7;
    
    data.push({
      time: time,
      open: Math.round(open * 100) / 100,
      high: Math.round(high * 100) / 100,
      low: Math.round(low * 100) / 100,
      close: Math.round(close * 100) / 100,
      volume: Math.round(Math.random() * 1500 + 300)
    });
    
    price = close;
  }
  return data;
}

function computeMA(data, period) {
  var result = [];
  for (var i = period - 1; i < data.length; i++) {
    var sum = 0;
    for (var j = 0; j < period; j++) {
      sum += data[i - j].close;
    }
    result.push({
      time: data[i].time,
      value: Math.round((sum / period) * 100) / 100
    });
  }
  return result;
}

function getSymbolData(symbol) {
  for (var i = 0; i < SYMBOLS.length; i++) {
    if (SYMBOLS[i].symbol === symbol) return SYMBOLS[i];
  }
  return SYMBOLS[0];
}

function getTimeframeData(tf) {
  for (var i = 0; i < TIMEFRAMES.length; i++) {
    if (TIMEFRAMES[i].tf === tf) return TIMEFRAMES[i];
  }
  return TIMEFRAMES[4];
}

function loadData() {
  var sym = getSymbolData(currentSymbol);
  var tf = getTimeframeData(currentTimeframe);
  var volatility = sym.price * 0.005;
  var generated = generateCandleData(300, sym.price, volatility, tf.seconds);
  
  currentChartData = generated;
  candleSeries.setData(generated);
  lastCandleData = generated[generated.length - 1];
  
  if (ma10Series) { try { chart.removeSeries(ma10Series); } catch(e){} }
  if (ma20Series) { try { chart.removeSeries(ma20Series); } catch(e){} }
  
  ma10Series = chart.addLineSeries({
    color: 'rgba(255, 200, 0, 0.7)',
    lineWidth: 2,
    crosshairMarkerVisible: false,
    priceLineVisible: false,
    lastValueVisible: false
  });
  ma10Series.setData(computeMA(generated, 10));
  
  ma20Series = chart.addLineSeries({
    color: 'rgba(180, 80, 255, 0.7)',
    lineWidth: 2,
    crosshairMarkerVisible: false,
    priceLineVisible: false,
    lastValueVisible: false
  });
  ma20Series.setData(computeMA(generated, 20));
  
  chart.timeScale().fitContent();
  
  rerunAllIndicators();
}

function startLiveSimulation() {
  setInterval(function() {
    if (!lastCandleData) return;
    var sym = getSymbolData(currentSymbol);
    var change = (Math.random() - 0.5) * sym.price * 0.001;
    var newClose = lastCandleData.close + change;
    var newHigh = Math.max(lastCandleData.high, newClose);
    var newLow = Math.min(lastCandleData.low, newClose);
    lastCandleData = {
      time: lastCandleData.time,
      open: lastCandleData.open,
      high: Math.round(newHigh * 100) / 100,
      low: Math.round(newLow * 100) / 100,
      close: Math.round(newClose * 100) / 100,
      volume: lastCandleData.volume
    };
    candleSeries.update(lastCandleData);
    
    if (currentChartData.length > 0) {
      currentChartData[currentChartData.length - 1] = Object.assign({}, lastCandleData);
    }
    
    sym.price = newClose;
    updateSymbolDisplay();
  }, 1500);
}

var consoleResizeHandle = document.getElementById('consoleResizeHandle');
var isResizingConsole = false;
var consoleStartY = 0;
var consoleStartHeight = 0;

consoleResizeHandle.addEventListener('mousedown', function(e) {
  e.preventDefault();
  isResizingConsole = true;
  consoleStartY = e.clientY;
  consoleStartHeight = editorConsole.offsetHeight;
  consoleResizeHandle.classList.add('dragging');
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', function(e) {
  if (!isResizingConsole) return;
  var deltaY = consoleStartY - e.clientY;
  var newHeight = Math.max(80, Math.min(500, consoleStartHeight + deltaY));
  editorConsole.style.setProperty('--console-height', newHeight + 'px');
});

document.addEventListener('mouseup', function() {
  if (isResizingConsole) {
    isResizingConsole = false;
    consoleResizeHandle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// Touch support for console resize
consoleResizeHandle.addEventListener('touchstart', function(e) {
  isResizingConsole = true;
  consoleStartY = e.touches[0].clientY;
  consoleStartHeight = editorConsole.offsetHeight;
  consoleResizeHandle.classList.add('dragging');
}, {passive: true});

document.addEventListener('touchmove', function(e) {
  if (!isResizingConsole) return;
  var deltaY = consoleStartY - e.touches[0].clientY;
  var newHeight = Math.max(80, Math.min(500, consoleStartHeight + deltaY));
  editorConsole.style.setProperty('--console-height', newHeight + 'px');
}, {passive: true});

document.addEventListener('touchend', function() {
  if (isResizingConsole) {
    isResizingConsole = false;
    consoleResizeHandle.classList.remove('dragging');
  }
});

    });
    ind.series = [];
    try { candleSeries.setMarkers([]); } catch(e){}
  }
  
  updateActiveIndicatorsBar();
  updateSidebar();
  updateIndicatorsList();
}

// Remove from chart only - keep indicator in sidebar/editor
function removeFromChartOnly(id) {
  var ind = findIndicator(id);
  if (!ind) return;
  
  // Remove series from chart
  ind.series.forEach(function(s) {
    try { chart.removeSeries(s); } catch(e){}
  });
  ind.series = [];
  try { candleSeries.setMarkers([]); } catch(e){}
  
  // Mark as inactive but keep in list
  ind.active = false;
  ind.hidden = false;
  
  updateActiveIndicatorsBar();
  updateSidebar();
  updateIndicatorsList();
  updateRunButton();
  
  logToConsole('Removed "' + ind.name + '" from chart (kept in editor)', 'info');
}

function openIndicatorSettings(id) {
  var ind = findIndicator(id);
  if (!ind) return;
  
  var newColor = prompt('Enter color for "' + ind.name + '" (hex, e.g. #ff00ff):', ind.color || '#ff00ff');
  if (newColor && /^#([0-9A-Fa-f]{3}){1,2}$/.test(newColor)) {
    ind.color = newColor;
    ind.series.forEach(function(s) {
      try { s.applyOptions({ color: newColor }); } catch(e){}
    });
    updateActiveIndicatorsBar();
    updateIndicatorsList();
  } else if (newColor !== null) {
    logToConsole('Invalid color format. Use hex like #ff00ff', 'error');
  }
}

function closeIndicator(id) {
  var ind = findIndicator(id);
  if (!ind) return;
  removeIndicatorSeries(ind);
  indicators = indicators.filter(function(i) { return i.id !== id; });
  if (currentIndicatorId === id) {
    if (indicators.length > 0) {
      loadIndicator(indicators[0].id);
    } else {
      currentIndicatorId = null;
      codeMirror.setValue('');
    }
  }
  updateSidebar();
  updateIndicatorsList();
  updateActiveIndicatorsBar();
  updateCurrentIndicatorDisplay();
  updateRunButton();
}

function loadIndicator(id) {
  var ind = findIndicator(id);
  if (!ind) return;
  currentIndicatorId = id;
  codeMirror.setValue(ind.code);
  updateSidebar();
  updateIndicatorsList();
  updateCurrentIndicatorDisplay();
  updateRunButton();
  setTimeout(function() { codeMirror.refresh(); }, 50);
}

function createIndicator(name, code) {
  var id = ++indicatorIdCounter;
  var newInd = {
    id: id,
    name: name,
    code: code || DEFAULT_INDICATOR_CODE,
    active: false,
    hidden: false,
    color: null,
    series: []
  };
  indicators.push(newInd);
  loadIndicator(id);
  return newInd;
}

function removeIndicatorSeries(ind) {
  ind.series.forEach(function(s) {
    try { chart.removeSeries(s); } catch(e){}
  });
  ind.series = [];
  ind.active = false;
  ind.hidden = false;
  try { candleSeries.setMarkers([]); } catch(e){}
}

function clearConsole() {
  consoleOutput.innerHTML = '';
}

function logToConsole(msg, type) {
  type = type || 'info';
  var line = document.createElement('div');
  line.className = 'console-line ' + type;
  var prefix = type === 'error' ? '✗' : (type === 'success' ? '✓' : '›');
  line.innerHTML = '<span class="prefix">' + prefix + '</span><span class="msg">' + escapeHtml(msg) + '</span>';
  consoleOutput.appendChild(line);
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
  editorConsole.classList.add('visible');
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toggleCurrentIndicator() {
  if (currentIndicatorId === null) {
    logToConsole('No indicator selected', 'error');
    return;
  }
  var ind = findIndicator(currentIndicatorId);
  if (!ind) return;
  
  if (ind.active && !ind.hidden) {
    stopIndicator(ind);
  } else {
    runIndicator(ind);
  }
}

function runIndicator(ind) {
  ind.code = codeMirror.getValue();
  
  logToConsole('Running: ' + ind.name + '.js', 'info');
  
  ind.series.forEach(function(s) {
    try { chart.removeSeries(s); } catch(e){}
  });
  ind.series = [];
  ind.hidden = false;
  
  try {
    var wrappedCode = ind.code + '\n;return main(data);';
    var fn = new Function('data', wrappedCode);
    var result = fn(currentChartData);
    
    if (!result || !result.type) {
      throw new Error('Indicator must return an object with {type, data}');
    }
    
    if (result.color && !ind.color) {
      ind.color = result.color;
    }
    var colorToUse = ind.color || result.color || '#ff00ff';
    
    if (result.type === 'line') {
      if (!result.data || !Array.isArray(result.data)) {
        throw new Error('Line indicator must return data array');
      }
      var lineSeries = chart.addLineSeries({
        color: colorToUse,
        lineWidth: result.lineWidth || 2,
        crosshairMarkerVisible: false,
        priceLineVisible: false,
        lastValueVisible: true,
        title: result.title || ind.name
      });
      lineSeries.setData(result.data);
      ind.series.push(lineSeries);
      ind.active = true;
      logToConsole('Line drawn: ' + result.data.length + ' points', 'success');
    } 
    else if (result.type === 'markers') {
      if (!result.data || !Array.isArray(result.data)) {
        throw new Error('Markers indicator must return data array');
      }
      candleSeries.setMarkers(result.data);
      ind.active = true;
      logToConsole('Markers set: ' + result.data.length + ' signals on chart', 'success');
    }
    else if (result.type === 'histogram') {
      if (!result.data || !Array.isArray(result.data)) {
        throw new Error('Histogram indicator must return data array');
      }
      var histSeries = chart.addHistogramSeries({
        priceFormat: { type: 'price' },
        priceScaleId: result.priceScaleId || '',
        color: colorToUse
      });
      histSeries.setData(result.data);
      ind.series.push(histSeries);
      ind.active = true;
      logToConsole('Histogram drawn: ' + result.data.length + ' bars', 'success');
    }
    else {
      throw new Error('Unknown type: ' + result.type + '. Use: line, markers, histogram');
    }
    
  } catch (err) {
    logToConsole(err.message, 'error');
    ind.active = false;
  }
  
  updateSidebar();
  updateIndicatorsList();
  updateActiveIndicatorsBar();
  updateRunButton();
}

function stopIndicator(ind) {
  removeIndicatorSeries(ind);
  updateSidebar();
  updateIndicatorsList();
  updateActiveIndicatorsBar();
  updateRunButton();
}

function updateRunButton() {
  var btn = document.getElementById('editorRun');
  var playIcon = btn.querySelector('.run-icon-play');
  var stopIcon = btn.querySelector('.run-icon-stop');
  var label = btn.querySelector('.run-label');
  
  if (currentIndicatorId === null) {
    btn.classList.remove('running');
    playIcon.style.display = '';
    stopIcon.style.display = 'none';
    label.textContent = 'Run';
    return;
  }
  
  var ind = findIndicator(currentIndicatorId);
  if (!ind) return;
  
  if (ind.active && !ind.hidden) {
    btn.classList.add('running');
    playIcon.style.display = 'none';
    stopIcon.style.display = '';
    label.textContent = 'Stop';
  } else {
    btn.classList.remove('running');
    playIcon.style.display = '';
    stopIcon.style.display = 'none';
    label.textContent = 'Run';
  }
}

function rerunIndicator(ind) {
  try {
    var wrappedCode = ind.code + '\n;return main(data);';
    var fn = new Function('data', wrappedCode);
    var result = fn(currentChartData);
    
    ind.series.forEach(function(s) { try { chart.removeSeries(s); } catch(e){} });
    ind.series = [];
    
    if (result && result.type === 'line' && result.data) {
      var colorToUse = ind.color || result.color || '#ff00ff';
      var lineSeries = chart.addLineSeries({
        color: colorToUse,
        lineWidth: result.lineWidth || 2,
        crosshairMarkerVisible: false,
        priceLineVisible: false,
        lastValueVisible: false,
        title: result.title || ind.name
      });
      lineSeries.setData(result.data);
      ind.series.push(lineSeries);
    } else if (result && result.type === 'markers' && result.data) {
      candleSeries.setMarkers(result.data);
    }
  } catch(e) {}
}

function rerunAllIndicators() {
  indicators.forEach(function(ind) {
    if (ind.active && !ind.hidden) {
      rerunIndicator(ind);
    }
  });
}

document.getElementById('editorBack').addEventListener('click', function() {
  navigateTo('chart');
});

document.getElementById('editorRun').addEventListener('click', function() {
  toggleCurrentIndicator();
});

document.getElementById('consoleClear').addEventListener('click', function() {
  clearConsole();
  editorConsole.classList.remove('visible');
});

document.getElementById('ciSettings').addEventListener('click', function() {
  if (currentIndicatorId !== null) {
    openIndicatorSettings(currentIndicatorId);
  }
});

document.getElementById('ciDelete').addEventListener('click', function() {
  if (currentIndicatorId !== null) {
    closeIndicator(currentIndicatorId);
  }
});

var newIndicatorModal = document.getElementById('newIndicatorModal');
var newIndicatorInput = document.getElementById('newIndicatorInput');
var newIndicatorFilename = document.getElementById('newIndicatorFilename');
var newIndicatorError = document.getElementById('newIndicatorError');

document.getElementById('editorNew').addEventListener('click', function() {
  openNewIndicatorModal();
});

function openNewIndicatorModal() {
  newIndicatorInput.value = '';
  newIndicatorFilename.textContent = 'File: untitled.js';
  newIndicatorError.textContent = '';
  newIndicatorModal.classList.add('visible');
  setTimeout(function() {
    newIndicatorInput.focus();
  }, 100);
}

function closeNewIndicatorModal() {
  newIndicatorModal.classList.remove('visible');
}

newIndicatorInput.addEventListener('input', function() {
  var val = newIndicatorInput.value.trim();
  if (val) {
    var sanitized = val.replace(/[^a-zA-Z0-9_\-]/g, '');
    newIndicatorFilename.textContent = 'File: ' + (sanitized || 'untitled') + '.js';
  } else {
    newIndicatorFilename.textContent = 'File: untitled.js';
  }
});

newIndicatorInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    confirmNewIndicator();
  }
});

document.getElementById('newIndicatorCancel').addEventListener('click', closeNewIndicatorModal);
document.getElementById('newIndicatorContinue').addEventListener('click', confirmNewIndicator);

newIndicatorModal.addEventListener('click', function(e) {
  if (e.target === newIndicatorModal) {
    closeNewIndicatorModal();
  }
});

function confirmNewIndicator() {
  var val = newIndicatorInput.value.trim();
  var sanitized = val.replace(/[^a-zA-Z0-9_\-]/g, '');
  
  if (!sanitized) {
    newIndicatorError.textContent = 'Please enter a valid name';
    return;
  }
  
  var exists = indicators.some(function(ind) {
    return ind.name.toLowerCase() === sanitized.toLowerCase();
  });
  if (exists) {
    newIndicatorError.textContent = 'An indicator with this name already exists';
    return;
  }
  
  createIndicator(sanitized, DEFAULT_INDICATOR_CODE);
  closeNewIndicatorModal();
}

(function () {
  var dashEls = document.querySelectorAll(
    '.hexagon-border, .hexagon, .notch-fill, .notch-fill-inner'
  );
  var bars = document.querySelectorAll('.bar');
  var trendLines = document.querySelectorAll('.trend-line');
  var trendAreas = document.querySelectorAll('.trend-area');
  var leftDots = document.querySelectorAll('.left-dot');
  var rightDots = document.querySelectorAll('.right-dot');
  var trendArrows = document.querySelectorAll('.trend-arrow');
  var logoContainer = document.querySelector('.logo-container');
  var bottomBar = document.getElementById('bottomBar');
  var chartContainer = document.getElementById('chartContainer');
  var topControls = document.getElementById('topControls');

  var lens = [];
  dashEls.forEach(function (p) {
    var len = p.getTotalLength();
    lens.push(len);
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });

  var trendLens = [];
  trendLines.forEach(function (p) {
    var len = p.getTotalLength();
    trendLens.push(len);
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });

  var DURATION = 2400;
  var start = null;
  var running = false;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function frame(now) {
    if (start === null) start = now;
    var t = Math.min(1, (now - start) / DURATION);
    var e = easeOut(t);

    dashEls.forEach(function (p, i) {
      var len = lens[i];
      if (p.classList.contains('symmetric')) {
        var onLen = e * len;
        var offLen = len - onLen;
        p.style.strokeDasharray = onLen + ' ' + offLen;
        p.style.strokeDashoffset = len * (1 + e) / 2;
      } else {
        p.style.strokeDashoffset = len * (1 - e);
      }
    });

    bars.forEach(function (b) {
      b.style.opacity = e;
      b.style.transform = 'scaleY(' + e + ')';
    });

    trendLines.forEach(function (p, i) {
      var len = trendLens[i];
      var delay = 0.25;
      var pt = Math.max(0, Math.min(1, (t - delay) / (1 - delay)));
      p.style.strokeDashoffset = len * (1 - easeOut(pt));
    });

    trendAreas.forEach(function (a) {
      var delay = 0.5;
      var at = Math.max(0, Math.min(1, (t - delay) / (1 - delay)));
      a.style.opacity = easeOut(at) * 0.9;
    });

    leftDots.forEach(function (d, i) {
      var delay = 0.3 + (i * 0.12);
      var dt = Math.max(0, Math.min(1, (t - delay) / (1 - delay)));
      var de = easeOut(dt);
      d.style.opacity = de;
      d.style.transform = 'scale(' + de + ')';
    });

    rightDots.forEach(function (d, i) {
      var delay = 0.3 + (i * 0.12);
      var dt = Math.max(0, Math.min(1, (t - delay) / (1 - delay)));
      var de = easeOut(dt);
      d.style.opacity = de;
      d.style.transform = 'scale(' + de + ')';
    });

    trendArrows.forEach(function (a) {
      var delay = 0.85;
      var at = Math.max(0, Math.min(1, (t - delay) / (1 - delay)));
      a.style.opacity = easeOut(at);
    });

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      running = false;
      pulseDots();
      setTimeout(function() {
        logoContainer.classList.add('expanded');
        setTimeout(function() {
          chartContainer.classList.add('visible');
          topControls.classList.add('visible');
          bottomBar.classList.add('visible');
          navigateTo('chart');
        }, 1200);
      }, 600);
    }
  }

  var pulsePhase = 0;
  var pulseRunning = false;
  function pulseDots() {
    if (pulseRunning) return;
    pulseRunning = true;
    function pulse(now) {
      pulsePhase += 0.05;
      var op = 0.5 + 0.5 * Math.sin(pulsePhase);
      leftDots.forEach(function (d, i) {
        var isLast = (i === 3);
        d.style.opacity = isLast ? (0.7 + 0.3 * Math.sin(pulsePhase * 1.5)) : op;
      });
      rightDots.forEach(function (d, i) {
        var isLast = (i === 3);
        d.style.opacity = isLast ? (0.7 + 0.3 * Math.sin(pulsePhase * 1.5)) : op;
      });
      if (running) { pulseRunning = false; return; }
      requestAnimationFrame(pulse);
    }
    requestAnimationFrame(pulse);
  }

  function play() {
    if (running) return;
    running = true;
    pulseRunning = false;
    start = null;
    requestAnimationFrame(frame);
  }

  document.querySelector('.logo-container').addEventListener('click', play);
  play();
})();
