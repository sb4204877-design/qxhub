<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QXView</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff}
.logo-container{width:460px;height:460px;position:relative;z-index:5;transform-origin:center center;transition:transform 3s cubic-bezier(0.22,1,0.36,1),opacity 1.5s ease,z-index 0.3s ease 2.5s}
.logo-container svg{width:100%;height:100%;overflow:visible;display:block}
.logo-container.expanded{transform:scale(2.2);opacity:0.25;z-index:0;pointer-events:none}
.hexagon-border{fill:none;stroke:url(#cyanGrad);stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:170;stroke-dashoffset:170;animation:drawHex 2s ease-out forwards}
.hexagon{fill:none;stroke:url(#blueGrad);stroke-width:3;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:170;stroke-dashoffset:170;animation:drawHex 2s ease-out forwards}
.bar{animation:growBar 2s ease-out forwards;opacity:0;fill:#000;stroke:url(#cyanGrad);stroke-width:2;stroke-linejoin:miter;transform-box:fill-box;transform-origin:center bottom}
.bar-2{stroke-width:3}
.notch-fill{fill:none;stroke:url(#cyanGrad);stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:40;stroke-dashoffset:40;animation:revealHead 2s ease-out forwards}
.notch-fill-inner{fill:none;stroke:url(#blueGrad);stroke-width:3;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:40;stroke-dashoffset:40;animation:revealHead 2s ease-out forwards}
@keyframes drawHex{to{stroke-dashoffset:0}}
@keyframes growBar{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes revealHead{to{stroke-dashoffset:0}}
.chart-container{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);z-index:1;opacity:0;pointer-events:none;transition:opacity 0.5s ease,left 0.3s ease,height 0.3s ease}
.chart-container.visible{opacity:1;pointer-events:auto}
#tvChart{width:100%;height:100%;touch-action:none}
.floating-indicators{position:absolute;top:56px;left:8px;z-index:10;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 16px);pointer-events:none}
.floating-indicator-group{display:flex;flex-direction:column;gap:2px;pointer-events:auto}
.floating-indicator-header{display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:4px;cursor:pointer;transition:background 0.15s ease;user-select:none}
.floating-indicator-header:hover{background:rgba(17,17,17,0.95);border-color:rgba(255,255,255,0.3)}
.floating-indicator-header .expand-icon{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease;flex-shrink:0}
.floating-indicator-header.expanded .expand-icon{transform:rotate(90deg)}
.floating-indicator-header .ind-name{color:#fff;font-size:11px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.floating-indicator-header .ind-actions{display:flex;gap:2px;flex-shrink:0}
.floating-indicator-header .ind-action{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#888;cursor:pointer;padding:0;transition:all 0.15s ease}
.floating-indicator-header .ind-action:hover{background:rgba(255,255,255,0.1);color:#fff}
.floating-indicator-header .ind-action.delete-ind:hover{color:#ff4466;background:rgba(255,68,102,0.15)}
.floating-indicator-header .ind-action svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.floating-plot-item{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 20px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);border-radius:3px;direction:ltr;transition:background 0.15s ease;max-width:100%}
.floating-plot-item:hover{background:rgba(17,17,17,0.85);border-color:rgba(255,255,255,0.2)}
.floating-plot-item.hidden-plot{opacity:0.4}
.floating-plot-item.hidden-plot .plot-name{text-decoration:line-through;color:#888}
.plot-color{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.plot-name{color:#fff;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.plot-actions{display:flex;gap:2px;flex-shrink:0}
.plot-action{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#888;cursor:pointer;padding:0;transition:all 0.15s ease}
.plot-action:hover{background:rgba(255,255,255,0.1);color:#fff}
.plot-action svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toggle-indicators-arrow{align-self:flex-start;width:24px;height:14px;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color 0.15s ease,background 0.15s ease;padding:0;pointer-events:auto}
.toggle-indicators-arrow:hover{color:#fff;background:rgba(0,0,0,0.95)}
.toggle-indicators-arrow svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.toggle-indicators-arrow.collapsed svg{transform:rotate(180deg)}
.ind-list-wrapper.hidden{display:none}
.top-controls{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;flex-direction:column;gap:0;opacity:0;transform:translateY(-20px);transition:opacity 0.5s ease,transform 0.5s ease,left 0.3s ease;pointer-events:none;direction:ltr}
.top-controls.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.top-bar{display:flex;align-items:center;gap:0;padding:0 8px;height:48px;background:#000;border-bottom:1px solid #1a1a1a}
.top-row{display:flex;align-items:center;gap:0;flex:1;height:100%}
.top-btn{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;background:transparent;border:none;border-right:1px solid #1a1a1a;color:#fff;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s ease;position:relative}
.top-btn:hover{background:#111}
.top-btn svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.top-btn.open svg.chevron{transform:rotate(180deg)}
.symbol-btn{flex-direction:row;gap:8px;padding:0 14px}
.symbol-name{color:#fff;font-size:14px;font-weight:600}
.symbol-info{display:flex;align-items:center;gap:8px;margin-left:8px}
.symbol-price{color:#fff;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.symbol-change{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.symbol-change.positive{color:#00ff88}
.symbol-change.negative{color:#ff4466}
.tf-btn{padding:0 12px;font-size:13px;font-weight:500}
.overlay-menu{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:50;opacity:0;pointer-events:none;transition:opacity 0.3s ease;overflow-y:auto;padding:30px 30px 90px}
.overlay-menu.visible{opacity:1;pointer-events:auto}
.overlay-header{max-width:1200px;margin:0 auto 20px}
.overlay-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.overlay-title{color:#fff;font-size:18px;font-weight:600;letter-spacing:0.3px}
.close-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #1a1a1a;border-radius:4px;color:#fff;cursor:pointer;transition:all 0.2s ease}
.close-btn:hover{background:#111;color:#fff}
.close-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search-box{position:relative;width:100%}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#888;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-input{width:100%;padding:10px 14px 10px 38px;background:#000;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s ease;direction:ltr}
.search-input::placeholder{color:#888}
.search-input:focus{border-color:#fff}
.no-results{text-align:center;padding:40px 20px;color:#888;font-size:13px;display:none}
.no-results.visible{display:block}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-width:1200px;margin:0 auto}
.item-card{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#000;border:1px solid #1a1a1a;border-radius:4px;cursor:pointer;transition:all 0.15s ease;opacity:0;transform:translateY(10px);animation:cardIn 0.3s forwards}
.item-card:hover{background:#111;border-color:#333}
.item-card.active{border-color:#00ff88;background:#111}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.item-symbol{color:#fff;font-size:13px;font-weight:600}
.item-change{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.item-change.positive{color:#00ff88}
.item-change.negative{color:#ff4466}
.tf-dropdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.95);min-width:240px;background:#000;border:1px solid #1a1a1a;border-radius:6px;padding:8px;opacity:0;pointer-events:none;transition:all 0.2s ease;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,0.8)}
.tf-dropdown.visible{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.tf-dropdown-header{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 10px;margin-bottom:4px;border-bottom:1px solid #1a1a1a}
.tf-dropdown-title{color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.tf-dropdown-close{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#fff;cursor:pointer;transition:all 0.2s ease}
.tf-dropdown-close:hover{background:#111;color:#fff}
.tf-dropdown-close svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.tf-options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tf-option{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;border-radius:4px;border:1px solid transparent;transition:all 0.15s ease}
.tf-option:hover{background:#111}
.tf-option.active{background:#00ff88;color:#000}
.tf-option .tf-label{font-size:10px;color:#888;font-weight:400}
.tf-option.active .tf-label{color:rgba(0,0,0,0.7)}
.editor-page{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);background:#000;z-index:80;opacity:0;pointer-events:none;transition:opacity 0.3s ease,left 0.3s ease,height 0.3s ease;display:flex;flex-direction:column}
.editor-page.visible{opacity:1;pointer-events:auto}
.editor-toolbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#000;border-bottom:1px solid #1a1a1a;flex-shrink:0;direction:ltr;height:48px}
.editor-toolbar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.editor-toolbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.current-indicator-display{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#000;border:1px solid #1a1a1a;border-radius:4px;min-width:0;max-width:260px}
.current-indicator-name{color:#fff;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.current-indicator-actions{display:flex;gap:2px;flex-shrink:0}
.ci-action{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#fff;cursor:pointer;transition:all 0.15s ease;padding:0}
.ci-action svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ci-action:hover{background:#111;color:#fff}
.editor-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:transparent;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
.editor-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.editor-btn:hover{background:#111;border-color:#333}
.editor-btn.primary{background:#00ff88;border-color:#00ff88;color:#000}
.editor-btn.primary:hover{background:#00ff99;border-color:#00ff99}
.editor-btn.primary:active{transform:scale(0.97)}
.editor-btn.primary.running{background:#ff4466;border-color:#ff4466;color:#fff}
.editor-btn.primary.running:hover{background:#ff5577;border-color:#ff5577}
.indicators-list-wrapper{background:#000;border-bottom:1px solid #1a1a1a;flex-shrink:0;direction:ltr;overflow:hidden;transition:max-height 0.3s ease;max-height:200px}
.indicators-list-wrapper.collapsed{max-height:0;border-bottom-color:transparent}
.indicators-list-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #1a1a1a}
.indicators-list-title{color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.indicators-list-count{color:#888;font-size:11px}
.indicators-list-body{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 10px;max-height:140px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
.indicators-list-body::-webkit-scrollbar{height:4px;width:4px}
.indicators-list-body::-webkit-scrollbar-track{background:transparent}
.indicators-list-body::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.ind-list-item{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#000;border:1px solid #1a1a1a;border-radius:4px;cursor:pointer;transition:all 0.15s ease}
.ind-list-item:hover{background:#111;border-color:#333}
.ind-list-item.active{border-color:#00ff88}
.ind-list-item.hidden-ind{opacity:0.5}
.ind-list-item.hidden-ind .ind-list-name{text-decoration:line-through}
.ind-list-color{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ind-list-name{color:#fff;font-size:11px;font-weight:500;white-space:nowrap}
.ind-list-status{width:5px;height:5px;border-radius:50%;background:#00ff88;flex-shrink:0}
.ind-list-status.inactive{background:#888}
.toggle-list-btn{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-50%);width:32px;height:16px;background:#000;border:1px solid #1a1a1a;border-top:none;border-radius:0 0 6px 6px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s ease;z-index:5;padding:0}
.toggle-list-btn:hover{color:#fff;background:#111}
.toggle-list-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.toggle-list-btn.collapsed svg{transform:rotate(180deg)}
.editor-body{flex:1;display:flex;overflow:hidden;position:relative;direction:ltr;min-height:0}
.editor-sidebar{width:220px;background:#000;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:10px 12px;border-bottom:1px solid #1a1a1a;color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.sidebar-list{flex:1;overflow-y:auto;padding:4px}
.sidebar-item{display:flex;align-items:center;gap:6px;padding:7px 10px;color:#fff;font-size:12px;border-radius:4px;cursor:pointer;transition:all 0.15s ease;margin-bottom:1px;position:relative}
.sidebar-item:hover{background:#111}
.sidebar-item.active{background:#00ff88;color:#000}
.sidebar-item.active .sidebar-delete-btn{color:rgba(0,0,0,0.5)}
.sidebar-item.active .sidebar-delete-btn:hover{color:#ff4466;background:rgba(255,68,102,0.2)}
.sidebar-item svg.item-icon{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar-item .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .item-status{width:6px;height:6px;border-radius:50%;background:#00ff88;flex-shrink:0}
.sidebar-item .item-status.inactive{background:#888}
.sidebar-delete-btn{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#666;cursor:pointer;padding:0;transition:all 0.15s ease;flex-shrink:0;opacity:0}
.sidebar-item:hover .sidebar-delete-btn{opacity:1}
.sidebar-delete-btn:hover{color:#ff4466;background:rgba(255,68,102,0.15)}
.sidebar-delete-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.editor-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.code-wrapper{flex:1;overflow:hidden;position:relative;background:#000;min-height:0}
.CodeMirror{height:100% !important;font-family:'Consolas','Monaco',monospace !important;font-size:13px !important;line-height:1.6 !important;background:#000 !important;color:#fff !important}
.CodeMirror-gutters{background:#000 !important;border-right:1px solid #1a1a1a !important}
.CodeMirror-linenumber{color:#888 !important;padding:0 8px !important}
.CodeMirror-cursor{border-left:1px solid #fff !important}
.CodeMirror-selected{background:rgba(0,255,136,0.3) !important}
.CodeMirror-activeline-background{background:rgba(17,17,17,0.5) !important}
.CodeMirror-matchingbracket{color:#fff !important;border-bottom:1px solid #fff}
.editor-side-toolbar{position:absolute;top:8px;right:8px;z-index:15;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.editor-side-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#fff;cursor:pointer;pointer-events:auto;transition:all 0.15s ease;padding:0;position:relative}
.editor-side-btn:hover{background:rgba(17,17,17,0.95);border-color:rgba(255,255,255,0.3)}
.editor-side-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.editor-side-btn.copied{border-color:#00ff88;color:#00ff88}
.editor-side-btn .tooltip{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.95);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:10px;font-weight:500;padding:3px 6px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s ease;font-family:inherit;letter-spacing:0.3px}
.editor-side-btn:hover .tooltip{opacity:1}
.editor-console{height:0;background:#000;border-top:1px solid #1a1a1a;overflow:hidden;transition:height 0.2s ease;display:flex;flex-direction:column;flex-shrink:0;position:relative}
.editor-console.visible{height:var(--console-height,140px)}
.console-resize-handle{position:absolute;top:-4px;left:0;width:100%;height:8px;background:transparent;cursor:ns-resize;z-index:10}
.console-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #1a1a1a;flex-shrink:0;cursor:ns-resize;user-select:none}
.console-title{color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;pointer-events:none}
.console-header-actions{display:flex;align-items:center;gap:4px}
.console-clear{background:transparent;border:none;color:#888;font-size:11px;cursor:pointer;padding:2px 8px;border-radius:3px;transition:all 0.15s ease}
.console-clear:hover{color:#fff;background:#111}
.console-close{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;color:#888;cursor:pointer;transition:all 0.15s ease;padding:0}
.console-close:hover{background:rgba(255,68,102,0.15);color:#ff4466}
.console-close svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.console-output{flex:1;overflow-y:auto;padding:8px 12px;font-family:'Consolas',monospace;font-size:12px;color:#fff;line-height:1.5}
.console-line{padding:2px 0;display:flex;gap:8px}
.console-line .prefix{color:#888;flex-shrink:0}
.console-line.error .prefix{color:#ff4466}
.console-line.error .msg{color:#ff4466}
.console-line.success .prefix{color:#00ff88}
.console-line.success .msg{color:#00ff88}
.console-line.info .msg{color:#fff}

/* ==================== SIGNALS PAGE ==================== */
.signals-page{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);background:#000;z-index:75;opacity:0;pointer-events:none;transition:opacity 0.3s ease,left 0.3s ease,height 0.3s ease;overflow-y:auto;padding:20px;direction:ltr}
.signals-page.visible{opacity:1;pointer-events:auto}
.signals-header{max-width:1200px;margin:0 auto 20px}
.signals-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.signals-title{color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;letter-spacing:0.3px}
.signals-title svg{width:22px;height:22px;stroke:#00f0ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.signals-title .title-accent{color:#00f0ff}

/* Stats bar - single row, no wrapping */
.signals-stats-bar{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;align-items:center;scrollbar-width:none;-ms-overflow-style:none}
.signals-stats-bar::-webkit-scrollbar{display:none}

.stat-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;flex-shrink:0}
.stat-chip .stat-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:700}
.stat-chip.active-stat{background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.2);color:#00f0ff}
.stat-chip.active-stat .stat-icon{background:rgba(0,240,255,0.2);color:#00f0ff}
.stat-chip.win-stat{background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);color:#00ff88}
.stat-chip.win-stat .stat-icon{background:rgba(0,255,136,0.2);color:#00ff88}
.stat-chip.loss-stat{background:rgba(255,68,102,0.08);border:1px solid rgba(255,68,102,0.2);color:#ff4466}
.stat-chip.loss-stat .stat-icon{background:rgba(255,68,102,0.2);color:#ff4466}
.stat-chip.rate-stat{background:rgba(171,130,255,0.08);border:1px solid rgba(171,130,255,0.2);color:#ab82ff}
.stat-chip.rate-stat .stat-icon{background:rgba(171,130,255,0.2);color:#ab82ff}

.signals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.signal-card{position:relative;border-radius:12px;overflow:hidden;opacity:0;transform:translateY(10px);animation:cardIn 0.3s forwards;transition:transform 0.2s ease,box-shadow 0.2s ease;cursor:pointer}
.signal-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.signal-card.buy-card{background:linear-gradient(135deg,rgba(0,40,20,0.95) 0%,rgba(0,60,30,0.85) 50%,rgba(0,40,20,0.95) 100%);border:1px solid rgba(0,255,136,0.2)}
.signal-card.sell-card{background:linear-gradient(135deg,rgba(50,10,15,0.95) 0%,rgba(70,15,25,0.85) 50%,rgba(50,10,15,0.95) 100%);border:1px solid rgba(255,68,102,0.2)}
.signal-card.buy-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00ff88,transparent)}
.signal-card.sell-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff4466,transparent)}
.signal-card-inner{padding:16px;display:flex;gap:14px;align-items:center}
.signal-timer-wrap{flex-shrink:0;position:relative;width:86px;height:86px}
.signal-timer-svg{width:100%;height:100%;transform:rotate(-90deg)}
.signal-timer-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:4}
.signal-timer-progress{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.buy-card .signal-timer-progress{stroke:#00ff88;filter:drop-shadow(0 0 4px rgba(0,255,136,0.3))}
.sell-card .signal-timer-progress{stroke:#ff4466;filter:drop-shadow(0 0 4px rgba(255,68,102,0.3))}
.signal-timer-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.signal-timer-count{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;line-height:1}
.signal-timer-label{font-size:7px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.5px;margin-top:3px}
.signal-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.signal-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;min-width:0}
.signal-symbol-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:0.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signal-type-badge{padding:3px 10px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;flex-shrink:0;white-space:nowrap}
.buy-card .signal-type-badge{background:rgba(0,255,136,0.15);color:#00ff88;border:1px solid rgba(0,255,136,0.25)}
.sell-card .signal-type-badge{background:rgba(255,68,102,0.15);color:#ff4466;border:1px solid rgba(255,68,102,0.25)}
.signal-entry-row{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.5);flex-wrap:wrap}
.signal-entry-row svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.signal-entry-row .val{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.signal-entry-row .sep{color:rgba(255,255,255,0.15);margin:0 2px}
.signal-open-hint{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,0.3);margin-top:2px}
.signal-open-hint svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}
.signal-new-badge{position:absolute;bottom:8px;right:8px;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;background:rgba(0,240,255,0.15);color:#00f0ff;border:1px solid rgba(0,240,255,0.3);z-index:2;pointer-events:none}
.signal-result-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;opacity:0;pointer-events:none;transition:opacity 0.5s ease;z-index:5;border-radius:12px}
.signal-result-overlay.visible{opacity:1;pointer-events:auto}
.signal-result-overlay.win{background:rgba(0,30,15,0.93);backdrop-filter:blur(6px)}
.signal-result-overlay.lose{background:rgba(40,5,10,0.93);backdrop-filter:blur(6px)}
.signal-result-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.signal-result-overlay.win .signal-result-icon{background:rgba(0,255,136,0.12);border:2px solid #00ff88}
.signal-result-overlay.lose .signal-result-icon{background:rgba(255,68,102,0.12);border:2px solid #ff4466}
.signal-result-icon svg{width:22px;height:22px;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.signal-result-overlay.win .signal-result-icon svg{stroke:#00ff88}
.signal-result-overlay.lose .signal-result-icon svg{stroke:#ff4466}
.signal-result-text{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.signal-result-overlay.win .signal-result-text{color:#00ff88}
.signal-result-overlay.lose .signal-result-text{color:#ff4466}
.signal-result-profit{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.signal-result-overlay.win .signal-result-profit{color:#00ff88}
.signal-result-overlay.lose .signal-result-profit{color:#ff4466}
.signal-card.expired{opacity:0.75}

/* ==================== INDICATORS PAGE ==================== */
.indicators-page{position:fixed;top:0;left:0;width:100%;height:calc(100% - 50px);background:#000;z-index:75;opacity:0;pointer-events:none;transition:opacity 0.3s ease,left 0.3s ease,height 0.3s ease;overflow-y:auto;padding:30px 30px 90px;direction:ltr}
.indicators-page.visible{opacity:1;pointer-events:auto}
.indicators-page-header{max-width:1200px;margin:0 auto 20px}
.indicators-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.indicators-title-row{display:flex;align-items:center;gap:12px}
.indicators-page-title{color:#fff;font-size:18px;font-weight:600}
.indicators-count-badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.25);color:#00f0ff}
.indicators-search-wrap{position:relative;width:280px;max-width:100%}
.indicators-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#888;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.indicators-search{width:100%;padding:9px 14px 9px 36px;background:rgba(0,0,0,0.6);border:1px solid #1a1a1a;border-radius:8px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s ease,background 0.2s ease}
.indicators-search::placeholder{color:#666}
.indicators-search:focus{border-color:#00f0ff;background:rgba(0,240,255,0.03)}
.indicators-page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.ind-page-card{padding:16px;background:#000;border:1px solid #1a1a1a;border-radius:6px;cursor:pointer;transition:all 0.2s ease;opacity:0;transform:translateY(10px);animation:cardIn 0.3s forwards}
.ind-page-card:hover{background:#111;border-color:#333}
.ind-page-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ind-page-name{color:#fff;font-size:13px;font-weight:600}
.ind-page-status{width:8px;height:8px;border-radius:50%;background:#00ff88}
.ind-page-status.inactive{background:#888}
.ind-page-desc{color:#888;font-size:11px;margin-bottom:12px;line-height:1.5}
.ind-page-actions{display:flex;gap:6px}
.ind-page-btn{flex:1;padding:6px 10px;background:#000;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
.ind-page-btn:hover{background:#111;border-color:#333}
.ind-page-btn.toggle.active{background:rgba(0,255,136,0.15);border-color:#00ff88;color:#00ff88}
.ind-page-btn.delete-btn{flex:0 0 auto;padding:6px 10px;color:#ff4466;border-color:rgba(255,68,102,0.3)}
.ind-page-btn.delete-btn:hover{background:rgba(255,68,102,0.15);border-color:#ff4466}
.ind-no-results{text-align:center;padding:60px 20px;color:#888;font-size:13px;grid-column:1/-1}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.modal-overlay.visible{opacity:1;pointer-events:auto}
.modal{width:90%;max-width:420px;background:#000;border:1px solid #1a1a1a;border-radius:8px;padding:24px;transform:scale(0.95);transition:transform 0.2s ease}
.modal-overlay.visible .modal{transform:scale(1)}
.modal-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:6px}
.modal-desc{color:#888;font-size:12px;margin-bottom:18px}
.modal-input{width:100%;padding:10px 12px;background:#000;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s ease;margin-bottom:6px;direction:ltr;text-align:left}
.modal-input:focus{border-color:#00ff88}
.modal-input::placeholder{color:#888}
.modal-filename{color:#888;font-size:11px;margin-bottom:18px;direction:ltr;text-align:left}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:8px 16px;background:transparent;border:1px solid #1a1a1a;border-radius:4px;color:#fff;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s ease}
.modal-btn:hover{background:#111;border-color:#333}
.modal-btn.primary{background:#00ff88;border-color:#00ff88;color:#000}
.modal-btn.primary:hover{background:#00ff99;border-color:#00ff99}
.modal-btn.danger{background:#ff4466;border-color:#ff4466;color:#fff}
.modal-btn.danger:hover{background:#ff5577;border-color:#ff5577}
.modal-error{color:#ff4466;font-size:11px;margin-bottom:10px;min-height:14px}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:0;padding:0;background:#000;border-top:1px solid #1a1a1a;opacity:0;pointer-events:none;transition:opacity 0.5s ease,transform 0.5s ease;z-index:100;direction:ltr;height:50px;transform:translateY(100%)}
.bottom-bar.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.tool-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 16px;background:transparent;border:none;cursor:pointer;transition:background 0.15s ease;flex:1;position:relative;min-width:80px;border-right:1px solid #1a1a1a}
.tool-btn:last-child{border-right:none}
.tool-btn:hover{background:#111}
.tool-btn.active{background:#111}
.tool-btn.active svg{stroke:#fff}
.tool-btn.active .label{color:#fff}
.tool-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.15s ease}
.tool-btn:hover svg{stroke:#fff}
.tool-btn .label{color:#fff;font-size:10px;font-weight:500;letter-spacing:0.3px;text-transform:uppercase;transition:color 0.15s ease;white-space:nowrap}
.tool-btn:hover .label{color:#fff}
.tool-btn .badge{position:absolute;top:6px;right:8px;min-width:16px;height:16px;padding:0 4px;background:#ff4466;color:#fff;font-size:9px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease,transform 0.3s ease}
.tool-btn .badge.hidden{opacity:0;transform:scale(0.5);pointer-events:none}

@media (min-width: 769px){
  .bottom-bar{top:0;bottom:0;left:0;right:auto;width:56px;height:100%;flex-direction:column;border-top:none;border-right:1px solid #1a1a1a;transform:translateX(-100%);padding:8px 0}
  .bottom-bar.visible{transform:translateX(0)}
  .tool-btn{flex:none;width:100%;min-width:unset;height:56px;border-right:none;border-bottom:1px solid #1a1a1a;padding:0;gap:3px}
  .tool-btn:last-child{border-bottom:none}
  .tool-btn svg{width:20px;height:20px}
  .tool-btn .label{font-size:8px;letter-spacing:0.2px}
  .tool-btn .badge{top:4px;right:4px;min-width:14px;height:14px;font-size:8px}
  .chart-container{left:56px;width:calc(100% - 56px);height:100%}
  .top-controls{left:56px}
  .editor-page{left:56px;width:calc(100% - 56px);height:100%}
  .signals-page{left:56px;width:calc(100% - 56px);height:100%}
  .indicators-page{left:56px;width:calc(100% - 56px);height:100%}
}
@media (max-width: 768px){.editor-sidebar{width:180px}}
@media (max-width: 600px){
  .logo-container{width:360px;height:360px}
  .logo-container.expanded{transform:scale(1.8)}
  .chart-container{height:calc(100% - 50px)}
  .symbol-info{display:none}
  .tool-btn{padding:0 10px;min-width:60px}
  .tool-btn svg{width:16px;height:16px}
  .tool-btn .label{font-size:9px}
  .editor-sidebar{width:60px}
  .sidebar-header{font-size:9px;padding:10px 6px;text-align:center}
  .sidebar-item{padding:8px 4px;flex-direction:column;gap:3px;font-size:9px}
  .sidebar-item .item-name{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);max-height:60px}
  .sidebar-delete-btn{opacity:1!important}
  .editor-toolbar{padding:6px 8px;gap:4px;flex-wrap:wrap}
  .editor-btn{padding:5px 8px;font-size:11px}
  .editor-btn span.btn-text{display:none}
  .CodeMirror{font-size:11px !important}
  .signals-grid{grid-template-columns:1fr}
  .signal-card-inner{padding:12px;gap:10px}
  .signal-timer-wrap{width:72px;height:72px}
  .signal-timer-count{font-size:15px}
  .signals-stats-bar{gap:6px}
  .stat-chip{padding:5px 10px;font-size:11px}
  .indicators-page-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .indicators-search-wrap{width:100%}
  .indicators-top-row{flex-direction:column;align-items:stretch}
  .editor-side-btn{width:26px;height:26px}
  .editor-side-btn svg{width:12px;height:12px}
}
@media (max-width: 380px){
  .logo-container{width:300px;height:300px}
  .logo-container.expanded{transform:scale(1.6)}
  .editor-sidebar{display:none}
  .indicators-page-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="chart-container" id="chartContainer"><div id="tvChart"></div><div class="floating-indicators" id="floatingIndicators"><div class="ind-list-wrapper" id="indListWrapper"></div><button class="toggle-indicators-arrow" id="toggleIndicatorsArrow" title="Hide/Show indicators"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button></div></div>
<div class="top-controls" id="topControls"><div class="top-bar"><div class="top-row"><button class="top-btn symbol-btn" id="symbolBtn"><span class="symbol-name" id="currentSymbol">BTC/USDT</span><div class="symbol-info"><span class="symbol-price" id="currentPrice">67,234.50</span><span class="symbol-change positive" id="currentChange">+2.45%</span></div><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button><button class="top-btn tf-btn" id="timeframeBtn"><span id="currentTimeframe">1m</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button></div></div></div>
<div class="tf-dropdown" id="tfDropdown"><div class="tf-dropdown-header"><div class="tf-dropdown-title">Timeframe</div><button class="tf-dropdown-close" id="tfClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="tf-options-grid" id="tfOptionsGrid"></div></div>
<div class="overlay-menu" id="symbolMenu"><div class="overlay-header"><div class="overlay-top-row"><div class="overlay-title">Select Market</div><button class="close-btn" data-close="symbolMenu"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="search-box"><input type="text" class="search-input" id="symbolSearch" placeholder="Search symbol..." autocomplete="off" spellcheck="false"/><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></div></div><div class="items-grid" id="symbolGrid"></div><div class="no-results" id="noResults">No markets found</div></div>

var MA10_CODE="// Moving Average 10\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  var period = 10;\n  if (data.length < period) return { plots: [] };\n  var result = [];\n  for (var i = period - 1; i < data.length; i++) {\n    var sum = 0;\n    for (var j = 0; j < period; j++) sum += data[i - j].close;\n    result.push({ time: data[i].time, value: sum / period });\n  }\n  return { plots: [{ type: 'line', name: 'MA 10', data: result, color: '#ffc452', width: 1 }] };\n}";
var MA20_CODE="// Moving Average 20\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  var period = 20;\n  if (data.length < period) return { plots: [] };\n  var result = [];\n  for (var i = period - 1; i < data.length; i++) {\n    var sum = 0;\n    for (var j = 0; j < period; j++) sum += data[i - j].close;\n    result.push({ time: data[i].time, value: sum / period });\n  }\n  return { plots: [{ type: 'line', name: 'MA 20', data: result, color: '#ab82ff', width: 1 }] };\n}";
var SIGNALS_EXAMPLE_CODE="// Trading Signals\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  var lookback = 3;\n  if (data.length < lookback * 2 + 1) return { plots: [] };\n  var markers = [], trendLine = [];\n  for (var i = lookback; i < data.length - lookback; i++) {\n    var curr = data[i];\n    if (!curr) continue;\n    var isLow = true, isHigh = true;\n    for (var j = 1; j <= lookback; j++) {\n      if (data[i-j].low < curr.low || data[i+j].low < curr.low) isLow = false;\n      if (data[i-j].high > curr.high || data[i+j].high > curr.high) isHigh = false;\n    }\n    if (isLow) markers.push({ time: curr.time, position: 'belowBar', color: '#00ff88', shape: 'arrowUp', text: 'BUY' });\n    if (isHigh) markers.push({ time: curr.time, position: 'aboveBar', color: '#ff4466', shape: 'arrowDown', text: 'SELL' });\n    var sum = 0, count = 0;\n    for (var j = 0; j < 5 && i-j >= 0; j++) { sum += data[i-j].close; count++; }\n    if (count > 0) trendLine.push({ time: curr.time, value: sum / count });\n  }\n  markers.sort(function(a,b){return a.time-b.time;});\n  return { plots: [{ type:'line',name:'SMA 5',data:trendLine,color:'#00bfff',width:1 },{ type:'markers',name:'Signals',data:markers }] };\n}";
var DEFAULT_INDICATOR_CODE="// Custom Indicator\nfunction main(data) {\n  if (!data || data.length === 0) return { plots: [] };\n  var period = 14;\n  if (data.length < period) return { plots: [] };\n  var upper=[],middle=[],lower=[];\n  for (var i=period-1;i<data.length;i++) {\n    var sum=0,count=0;\n    for(var j=0;j<period;j++){sum+=data[i-j].close;count++;}\n    if(!count)continue;\n    var avg=sum/count,variance=0;\n    for(var j=0;j<period;j++){var d=data[i-j].close-avg;variance+=d*d;}\n    var std=Math.sqrt(variance/count);\n    middle.push({time:data[i].time,value:avg});\n    upper.push({time:data[i].time,value:avg+2*std});\n    lower.push({time:data[i].time,value:avg-2*std});\n  }\n  return{plots:[{type:'line',name:'Upper',data:upper,color:'#00ff88',width:1,lineStyle:1},{type:'line',name:'Middle',data:middle,color:'#00bfff',width:2},{type:'line',name:'Lower',data:lower,color:'#ff4466',width:1,lineStyle:1},{type:'fill',name:'Fill',upperData:upper,lowerData:lower,color:'rgba(0,191,255,0.08)'}]};\n}";

// ===== NEW SMOOTH SOUND (Short & Clean) =====
var audioCtx=null;
function playTradeSound(){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    var now=audioCtx.currentTime;

    var masterGain=audioCtx.createGain();
    masterGain.gain.value=0.5;
    masterGain.connect(audioCtx.destination);

    var filter=audioCtx.createBiquadFilter();
    filter.type='lowpass';
    filter.frequency.setValueAtTime(4000,now);
    filter.frequency.exponentialRampToValueAtTime(1500,now+0.2);
    filter.Q.value=0.5;
    filter.connect(masterGain);

    // Stage 1: Rising start (0.15s)
    var s1Osc=audioCtx.createOscillator();
    s1Osc.type='sine';
    s1Osc.frequency.setValueAtTime(392.00,now);
    s1Osc.frequency.exponentialRampToValueAtTime(523.25,now+0.06);

    var s1Gain=audioCtx.createGain();
    s1Gain.gain.setValueAtTime(0,now);
    s1Gain.gain.linearRampToValueAtTime(0.3,now+0.02);
    s1Gain.gain.exponentialRampToValueAtTime(0.001,now+0.14);
    s1Gain.gain.linearRampToValueAtTime(0,now+0.16);

    s1Osc.connect(s1Gain);
    s1Gain.connect(filter);
    s1Osc.start(now);
    s1Osc.stop(now+0.2);

    // Stage 2: Short pleasant ending (0.1s)
    var s2Delay=0.08;
    var s2Attack=0.02;
    var s2FadeOut=0.08;
    var s2Freqs=[523.25,659.25];

    s2Freqs.forEach(function(freq){
      var osc=audioCtx.createOscillator();
      osc.type='sine';
      osc.frequency.value=freq;

      var gain=audioCtx.createGain();
      gain.gain.setValueAtTime(0,now+s2Delay);
      gain.gain.linearRampToValueAtTime(0.15,now+s2Delay+s2Attack);
      gain.gain.exponentialRampToValueAtTime(0.001,now+s2Delay+s2Attack+s2FadeOut);
      gain.gain.linearRampToValueAtTime(0,now+s2Delay+s2Attack+s2FadeOut+0.02);

      osc.connect(gain);
      gain.connect(filter);
      osc.start(now+s2Delay);
      osc.stop(now+s2Delay+s2Attack+s2FadeOut+0.05);
    });
  }catch(e){}
}

function updateMarkersForActiveIndicators(){var am=[];indicators.forEach(function(ind){if(ind.active&&!ind.hidden){ind.plots.forEach(function(plot){if(plot.type==='markers'&&plot.visible){try{var fn=new Function('data',ind.code+'\n;return main(data);');var r=fn(currentChartData);var ps=normalizeResult(r);ps.forEach(function(p){if(p&&p.type==='markers'&&p.name===plot.name&&p.data){p.data.forEach(function(m){am.push({time:m.time,position:m.position||'aboveBar',color:m.color||'#00ff88',shape:m.shape||'circle',text:m.text||''});});}});}catch(e){}}});}});am.sort(function(a,b){return a.time-b.time;});var um=[],seen={};am.forEach(function(m){var k=m.time+'_'+m.position;if(!seen[k]){seen[k]=true;um.push(m);}});candleSeries.setMarkers(um);currentMarkers=um;}

var TR=36,TC=2*Math.PI*TR,sUI=null;
function getSR(s){return Math.max(0,s.duration-(Math.floor(Date.now()/1000)-s.startTime));}
function resolveSignal(s){if(s.result!==null)return;s.result=Math.random()<0.65?'win':'lose';var bp=Math.random()*1.5+0.3;s.profit=s.result==='win'?bp:-(bp*0.6);playTradeSound();}

function updateSignalsStats(){
  var w=0,l=0,p=0;
  SIGNALS_DATA.forEach(function(s){if(s.result==='win')w++;else if(s.result==='lose')l++;else p++;});
  var t=w+l,wr=t>0?Math.round(w/t*100):0;
  document.getElementById('signalsStats').innerHTML='<div class="stat-chip active-stat"><span class="stat-icon">◷</span><span>'+p+' Active</span></div><div class="stat-chip win-stat"><span class="stat-icon">✓</span><span>'+w+' Wins</span></div><div class="stat-chip loss-stat"><span class="stat-icon">✗</span><span>'+l+' Losses</span></div><div class="stat-chip rate-stat"><span class="stat-icon">%</span><span>'+wr+'% Rate</span></div>';
}

function updateBadgeVisibility(){
  var b=document.getElementById('signalsBadge');if(!b)return;
  if(signalsBadgeDismissed){b.classList.add('hidden');}
  else{var nc=0;SIGNALS_DATA.forEach(function(s){if(s.isNew)nc++;});if(nc>0){b.textContent=nc;b.classList.remove('hidden');}else{b.classList.add('hidden');}}
}

function buildSignalsPage(){
  if(sUI){clearInterval(sUI);sUI=null;}
  var grid=document.getElementById('signalsGrid');grid.innerHTML='';
  SIGNALS_DATA.forEach(function(sig,i){
    var rem=getSR(sig),prog=sig.duration>0?rem/sig.duration:0;
    var dOff=TC*(1-prog);var isBuy=sig.type==='buy';var cc=isBuy?'buy-card':'sell-card';
    if(rem<=0&&sig.result===null)resolveSignal(sig);
    var card=document.createElement('div');
    card.className='signal-card '+cc+(sig.result!==null?' expired':'');
    card.style.animationDelay=(i*0.06)+'s';
    card.setAttribute('data-signal-id',sig.id);
    var tdo=sig.result!==null?TC:dOff;
    var ct=sig.result!==null?'0:00':formatCountdown(rem);
    var nb=sig.isNew?'<span class="signal-new-badge">NEW</span>':'';
    card.innerHTML='<div class="signal-card-inner"><div class="signal-timer-wrap"><svg class="signal-timer-svg" viewBox="0 0 86 86"><circle class="signal-timer-bg" cx="43" cy="43" r="'+TR+'"/><circle class="signal-timer-progress" cx="43" cy="43" r="'+TR+'" stroke-dasharray="'+TC+'" stroke-dashoffset="'+tdo+'"/></svg><div class="signal-timer-center"><div class="signal-timer-count">'+ct+'</div><div class="signal-timer-label">'+(sig.result!==null?'Closed':'Left')+'</div></div></div><div class="signal-info"><div class="signal-top-row"><span class="signal-symbol-name">'+sig.symbol+'</span><span class="signal-type-badge">'+(isBuy?'▲ BUY':'▼ SELL')+'</span></div><div class="signal-entry-row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="val">'+formatTime(sig.startTime)+'</span><span class="sep">|</span><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="val">'+formatPrice(sig.entry)+'</span></div><div class="signal-open-hint"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span>Tap to open chart</span></div></div></div>'+nb+'<div class="signal-result-overlay '+(sig.result||'')+'"><div class="signal-result-icon">'+(sig.result==='win'?'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':sig.result==='lose'?'<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>':'')+'</div><div class="signal-result-text">'+(sig.result==='win'?'PROFIT':sig.result==='lose'?'LOSS':'')+'</div><div class="signal-result-profit">'+(sig.profit!==null?(sig.profit>=0?'+':'')+sig.profit.toFixed(2)+'%':'')+'</div></div>';
    card.addEventListener('click',function(){SIGNALS_DATA.forEach(function(s){s.isNew=false;});signalsBadgeDismissed=true;updateBadgeVisibility();currentSymbol=sig.symbol;updateSymbolDisplay();refreshChart();navigateTo('chart');});
    grid.appendChild(card);
  });
  updateSignalsStats();startSignalsTimer();
}

function startSignalsTimer(){
  if(sUI)clearInterval(sUI);
  sUI=setInterval(function(){
    var any=false,need=false;
    SIGNALS_DATA.forEach(function(sig){
      var card=document.querySelector('[data-signal-id="'+sig.id+'"]');if(!card)return;
      var rem=getSR(sig);
      if(rem<=0&&sig.result===null){resolveSignal(sig);need=true;return;}
      if(sig.result!==null)return;any=true;
      var prog=rem/sig.duration,dOff=TC*(1-prog);
      var pc=card.querySelector('.signal-timer-progress');if(pc)pc.setAttribute('stroke-dashoffset',dOff);
      var ce=card.querySelector('.signal-timer-count');if(ce)ce.textContent=formatCountdown(rem);
    });
    updateSignalsStats();
    if(need){buildSignalsPage();return;}
    if(!any){clearInterval(sUI);sUI=null;}
  },1000);
}

setInterval(function(){
  var syms=['BTC/USDT','ETH/USDT','SOL/USDT','XRP/USDT','AVAX/USDT','DOGE/USDT','LINK/USDT','ADA/USDT','NEAR/USDT','APT/USDT'];
  var sym=syms[Math.floor(Math.random()*syms.length)];
  var sd=getSymbolData(sym);
  var type=Math.random()<0.5?'buy':'sell';
  SIGNALS_DATA.unshift({id:Date.now(),symbol:sym,type:type,entry:sd.price,duration:Math.floor(Math.random()*180)+60,startTime:Math.floor(Date.now()/1000),result:null,profit:null,isNew:true});
  playTradeSound();signalsBadgeDismissed=false;updateBadgeVisibility();updateSignalsStats();
  if(currentPage==='signals')buildSignalsPage();

function buildIndicatorsPage(){

  if(badge)badge.textContent=indicators.length+' indicators';

  var filtered=indicators.filter(function(ind){return!q||ind.name.toUpperCase().indexOf(q)!==-1;});
  if(!indicators.length){grid.innerHTML='<div class="ind-no-results">No indicators yet. Click Editor → New to create one.</div>';return;}
  if(!filtered.length){grid.innerHTML='<div class="ind-no-results">No indicators matching "'+(indicatorsSearchQuery||'')+'"</div>';return;}
  filtered.forEach(function(ind,i){
    var card=document.createElement('div');card.className='ind-page-card';card.style.animationDelay=(i*0.05)+'s';
    var pc=ind.plots?ind.plots.length:0;
    card.innerHTML='<div class="ind-page-card-header"><span class="ind-page-name">'+ind.name+'</span><span class="ind-page-status '+(ind.active?'':'inactive')+'"></span></div><div class="ind-page-desc">'+pc+' plot(s). '+(ind.active?'Currently drawn on chart.':'Not active.')+'</div><div class="ind-page-actions"><button class="ind-page-btn edit" data-id="'+ind.id+'">Edit</button><button class="ind-page-btn toggle '+(ind.active?'active':'')+'" data-id="'+ind.id+'">'+(ind.active?'Running':'Run')+'</button><button class="ind-page-btn delete-btn" data-id="'+ind.id+'" title="Delete">✕</button></div>';
    grid.appendChild(card);
  });
  grid.querySelectorAll('.ind-page-btn.edit').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();loadIndicator(parseInt(b.getAttribute('data-id')));navigateTo('editor');});});
  grid.querySelectorAll('.ind-page-btn.toggle').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();loadIndicator(parseInt(b.getAttribute('data-id')));toggleCurrentIndicator();buildIndicatorsPage();});});
  grid.querySelectorAll('.ind-page-btn.delete-btn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();openDeleteConfirm(parseInt(b.getAttribute('data-id')));});});
}

function toggleIndicatorsOnChart(){indicatorsOnChartHidden=!indicatorsOnChartHidden;if(indicatorsOnChartHidden){indListWrapper.classList.add('hidden');toggleIndicatorsArrow.classList.add('collapsed');}else{indListWrapper.classList.remove('hidden');toggleIndicatorsArrow.classList.remove('collapsed');}}

function updateCurrentIndicatorDisplay(){if(currentIndicatorId===null){currentIndicatorName.textContent='No indicator';document.getElementById('ciSettings').style.display='none';document.getElementById('ciDelete').style.display='none';return;}var ind=findIndicator(currentIndicatorId);if(!ind)return;currentIndicatorName.textContent=ind.name;document.getElementById('ciSettings').style.display='';document.getElementById('ciDelete').style.display='';}

var expandedIndicators={};
function updateFloatingIndicators(){indListWrapper.innerHTML='';var shown=indicators.filter(function(ind){return ind.active||ind.hidden;});if(!shown.length){toggleIndicatorsArrow.style.display='none';return;}toggleIndicatorsArrow.style.display='';shown.forEach(function(ind){var group=document.createElement('div');group.className='floating-indicator-group';var isExp=expandedIndicators[ind.id]!==false;var header=document.createElement('div');header.className='floating-indicator-header'+(isExp?' expanded':'');var aH='<div class="ind-actions"><button class="ind-action settings-ind" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="ind-action toggle-ind" title="'+(ind.hidden?'Show':'Hide')+'">'+(ind.hidden?'<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>':'<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>')+'</button><button class="ind-action delete-ind" title="Remove from chart"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';header.innerHTML='<svg class="expand-icon" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg><span class="ind-name">'+ind.name+(ind.hidden?' (hidden)':'')+'</span>'+aH;header.addEventListener('click',function(e){if(e.target.closest('.ind-action'))return;expandedIndicators[ind.id]=!isExp;updateFloatingIndicators();});header.querySelector('.settings-ind').addEventListener('click',function(e){e.stopPropagation();openIndicatorSettings(ind.id);});header.querySelector('.toggle-ind').addEventListener('click',function(e){e.stopPropagation();toggleIndicatorVisibility(ind.id);});header.querySelector('.delete-ind').addEventListener('click',function(e){e.stopPropagation();removeFromChartOnly(ind.id);});group.appendChild(header);if(isExp&&ind.plots){ind.plots.forEach(function(plot){var pi=document.createElement('div');pi.className='floating-plot-item'+(plot.visible?'':' hidden-plot');var cl=plot.color||'#00ff88';if(plot.type==='fill')cl=plot.color||'rgba(0,191,255,0.3)';pi.innerHTML='<span class="plot-color" style="background:'+cl+'"></span><span class="plot-name">'+plot.name+' <span style="color:#888;font-size:9px">('+plot.type+')</span></span><div class="plot-actions"><button class="plot-action toggle-plot" title="'+(plot.visible?'Hide':'Show')+'">'+(plot.visible?'<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>':'<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>')+'</button></div>';pi.querySelector('.toggle-plot').addEventListener('click',function(e){e.stopPropagation();togglePlotVisibility(ind.id,plot.name);});group.appendChild(pi);});}indListWrapper.appendChild(group);});}

function togglePlotVisibility(indId,plotName){var ind=findIndicator(indId);if(!ind)return;var plot=null;for(var i=0;i<ind.plots.length;i++){if(ind.plots[i].name===plotName){plot=ind.plots[i];break;}}if(!plot)return;plot.visible=!plot.visible;if(plot.seriesRef){if(plot.type==='fill'&&plot.seriesRef.setVisible)plot.seriesRef.setVisible(plot.visible);else if(plot.seriesRef.applyOptions)plot.seriesRef.applyOptions({visible:plot.visible});}if(plot.type==='markers'&&!plot.visible)rebuildAllMarkers();updateFloatingIndicators();}
function toggleIndicatorVisibility(id){var ind=findIndicator(id);if(!ind)return;if(ind.hidden){ind.hidden=false;rerunIndicator(ind);}else{ind.hidden=true;ind.plots.forEach(function(plot){if(plot.seriesRef){try{if(plot.type==='fill'&&plot.seriesRef.remove)plot.seriesRef.remove();else chart.removeSeries(plot.seriesRef);}catch(e){}}});ind.plots=[];rebuildAllMarkers();}updateFloatingIndicators();updateSidebar();updateIndicatorsList();}
function openIndicatorSettings(id){var ind=findIndicator(id);if(!ind)return;var nc=prompt('Enter color for "'+ind.name+'" (hex, e.g. #00ff88):',ind.color||'#00ff88');if(nc&&/^#([0-9A-Fa-f]{3}){1,2}$/.test(nc)){ind.color=nc;ind.plots.forEach(function(plot){if(plot.seriesRef&&plot.seriesRef.applyOptions&&plot.type!=='fill'){try{plot.seriesRef.applyOptions({color:nc});}catch(e){}}});updateFloatingIndicators();updateIndicatorsList();}}
function removeFromChartOnly(id){var ind=findIndicator(id);if(!ind)return;ind.plots.forEach(function(plot){if(plot.seriesRef){try{if(plot.type==='fill'&&plot.seriesRef.remove)plot.seriesRef.remove();else chart.removeSeries(plot.seriesRef);}catch(e){}}});ind.plots=[];ind.active=false;ind.hidden=false;rebuildAllMarkers();updateFloatingIndicators();updateSidebar();updateIndicatorsList();updateRunButton();}
function deleteIndicatorFull(id){var ind=findIndicator(id);if(!ind)return;ind.plots.forEach(function(plot){if(plot.seriesRef){try{if(plot.type==='fill'&&plot.seriesRef.remove)plot.seriesRef.remove();else chart.removeSeries(plot.seriesRef);}catch(e){}}});indicators=indicators.filter(function(i){return i.id!==id;});if(currentIndicatorId===id){if(indicators.length>0)loadIndicator(indicators[0].id);else{currentIndicatorId=null;codeMirror.setValue('');}}rebuildAllMarkers();updateSidebar();updateIndicatorsList();updateFloatingIndicators();updateCurrentIndicatorDisplay();updateRunButton();}

var deleteConfirmModal=document.getElementById('deleteConfirmModal'),deleteConfirmDesc=document.getElementById('deleteConfirmDesc'),deleteConfirmBtn=document.getElementById('deleteConfirmBtn'),deleteCancelBtn=document.getElementById('deleteCancelBtn');
function openDeleteConfirm(id){var ind=findIndicator(id);if(!ind)return;pendingDeleteId=id;deleteConfirmDesc.textContent='Are you sure you want to delete "'+ind.name+'"?';deleteConfirmModal.classList.add('visible');}
function closeDeleteConfirmModal(){deleteConfirmModal.classList.remove('visible');pendingDeleteId=null;}
deleteCancelBtn.addEventListener('click',closeDeleteConfirmModal);
deleteConfirmBtn.addEventListener('click',function(){if(pendingDeleteId!==null)deleteIndicatorFull(pendingDeleteId);closeDeleteConfirmModal();});
deleteConfirmModal.addEventListener('click',function(e){if(e.target===deleteConfirmModal)closeDeleteConfirmModal();});

function loadIndicator(id){var ind=findIndicator(id);if(!ind)return;currentIndicatorId=id;codeMirror.setValue(ind.code);updateSidebar();updateIndicatorsList();updateCurrentIndicatorDisplay();updateRunButton();setTimeout(function(){codeMirror.refresh();},50);}
function createIndicator(name,code){var id=++indicatorIdCounter;var ni={id:id,name:name,code:code||DEFAULT_INDICATOR_CODE,active:false,hidden:false,color:null,plots:[],isMarkerIndicator:false};indicators.push(ni);loadIndicator(id);return ni;}
function removeIndicatorSeries(ind){ind.plots.forEach(function(plot){if(plot.seriesRef){try{if(plot.type==='fill'&&plot.seriesRef.remove)plot.seriesRef.remove();else chart.removeSeries(plot.seriesRef);}catch(e){}}});ind.plots=[];ind.active=false;ind.hidden=false;ind.isMarkerIndicator=false;}
function rebuildAllMarkers(){var am=[];indicators.forEach(function(ind){if(ind.active&&!ind.hidden){ind.plots.forEach(function(plot){if(plot.type==='markers'&&plot.visible&&plot.data){plot.data.forEach(function(m){am.push({time:m.time,position:m.position||'aboveBar',color:m.color||'#00ff88',shape:m.shape||'circle',text:m.text||''});});}});}});am.sort(function(a,b){return a.time-b.time;});var um=[],seen={};am.forEach(function(m){var k=m.time+'_'+m.position;if(!seen[k]){seen[k]=true;um.push(m);}});candleSeries.setMarkers(um);currentMarkers=um;}
function clearConsole(){consoleOutput.innerHTML='';}
function logToConsole(msg,type){type=type||'info';var line=document.createElement('div');line.className='console-line '+type;var prefix=type==='error'?'✗':(type==='success'?'✓':'›');line.innerHTML='<span class="prefix">'+prefix+'</span><span class="msg">'+escapeHtml(msg)+'</span>';consoleOutput.appendChild(line);consoleOutput.scrollTop=consoleOutput.scrollHeight;editorConsole.classList.add('visible');}
function escapeHtml(str){var d=document.createElement('div');d.textContent=str;return d.innerHTML;}
function toggleCurrentIndicator(){if(currentIndicatorId===null)return;var ind=findIndicator(currentIndicatorId);if(!ind)return;if(ind.active&&!ind.hidden)stopIndicator(ind);else runIndicator(ind);}
function runIndicator(ind){ind.code=codeMirror.getValue();logToConsole('Running: '+ind.name+'.js','info');ind.plots.forEach(function(plot){if(plot.seriesRef){try{if(plot.type==='fill'&&plot.seriesRef.remove)plot.seriesRef.remove();else chart.removeSeries(plot.seriesRef);}catch(e){}}});ind.plots=[];ind.hidden=false;try{var fn=new Function('data',ind.code+'\n;return main(data);');var result=fn(currentChartData);if(!result)throw new Error('Indicator must return a result object');var plots=normalizeResult(result);if(!plots.length)throw new Error('No plots returned');var pc=0,pn=[];plots.forEach(function(plot){if(!plot)return;pc++;if(!plot.name||plot.name.startsWith('Plot '))plot.name=plot.name||('Plot '+pc);var sr=createPlotSeries(plot,ind);pn.push(plot.name+' ('+plot.type+')');ind.plots.push({id:ind.id+'_'+pc,name:plot.name,type:plot.type,color:plot.color,width:plot.width,lineStyle:plot.lineStyle,visible:true,seriesRef:sr,data:plot.data,upperData:plot.upperData,lowerData:plot.lowerData});});ind.active=true;ind.isMarkerIndicator=plots.some(function(p){return p&&p.type==='markers';});logToConsole('✓ '+ind.name+' loaded — '+plots.length+' plot(s): '+pn.join(', '),'success');navigateTo('chart');}catch(err){logToConsole(err.message,'error');ind.active=false;ind.isMarkerIndicator=false;}updateSidebar();updateIndicatorsList();updateFloatingIndicators();updateRunButton();}
function stopIndicator(ind){removeIndicatorSeries(ind);rebuildAllMarkers();logToConsole('Stopped: '+ind.name,'info');updateSidebar();updateIndicatorsList();updateFloatingIndicators();updateRunButton();}
function updateRunButton(){var btn=document.getElementById('editorRun'),pi=btn.querySelector('.run-icon-play'),si=btn.querySelector('.run-icon-stop'),lb=btn.querySelector('.run-label');if(currentIndicatorId===null){btn.classList.remove('running');pi.style.display='';si.style.display='none';lb.textContent='Run';return;}var ind=findIndicator(currentIndicatorId);if(!ind)return;if(ind.active&&!ind.hidden){btn.classList.add('running');pi.style.display='none';si.style.display='';lb.textContent='Stop';}else{btn.classList.remove('running');pi.style.display='';si.style.display='none';lb.textContent='Run';}}
function rerunIndicator(ind){try{var fn=new Function('data',ind.code+'\n;return main(data);');var result=fn(currentChartData);if(!result)return;var plots=normalizeResult(result);ind.plots.forEach(function(plot){if(plot.seriesRef){try{if(plot.type==='fill'&&plot.seriesRef.remove)plot.seriesRef.remove();else chart.removeSeries(plot.seriesRef);}catch(e){}}});ind.plots=[];plots.forEach(function(plot){if(!plot)return;var sr=createPlotSeries(plot,ind);ind.plots.push({id:ind.id+'_'+plot.name,name:plot.name,type:plot.type,color:plot.color,width:plot.width,lineStyle:plot.lineStyle,visible:true,seriesRef:sr,data:plot.data,upperData:plot.upperData,lowerData:plot.lowerData});});}catch(e){}}
function rerunAllIndicators(){currentMarkers=[];candleSeries.setMarkers([]);indicators.forEach(function(ind){if(ind.active&&!ind.hidden)rerunIndicator(ind);});}

document.getElementById('editorBack').addEventListener('click',function(){navigateTo('chart');});
document.getElementById('editorRun').addEventListener('click',function(){toggleCurrentIndicator();});
document.getElementById('consoleClear').addEventListener('click',function(e){e.stopPropagation();clearConsole();});
document.getElementById('consoleClose').addEventListener('click',function(e){e.stopPropagation();editorConsole.classList.remove('visible');});
document.getElementById('ciSettings').addEventListener('click',function(){if(currentIndicatorId!==null)openIndicatorSettings(currentIndicatorId);});
document.getElementById('ciDelete').addEventListener('click',function(){if(currentIndicatorId!==null)openDeleteConfirm(currentIndicatorId);});

var btnSelectAll=document.getElementById('btnSelectAll'),btnCopy=document.getElementById('btnCopy'),btnCut=document.getElementById('btnCut');
btnSelectAll.addEventListener('click',function(){if(!codeMirror)return;codeMirror.setSelection({line:0,ch:0},{line:codeMirror.lineCount()-1,ch:codeMirror.getLine(codeMirror.lineCount()-1).length});codeMirror.focus();});
btnCopy.addEventListener('click',function(){if(!codeMirror)return;var text=codeMirror.getSelection();if(!text){text=codeMirror.getValue();codeMirror.setSelection({line:0,ch:0},{line:codeMirror.lineCount()-1,ch:codeMirror.getLine(codeMirror.lineCount()-1).length});}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){flashButton(btnCopy);}).catch(function(){fallbackCopy(text);});else fallbackCopy(text);});
btnCut.addEventListener('click',function(){if(!codeMirror)return;var text=codeMirror.getSelection();if(!text){text=codeMirror.getValue();codeMirror.setValue('');}else{codeMirror.replaceSelection('');}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){flashButton(btnCut);}).catch(function(){fallbackCopy(text);});else fallbackCopy(text);});
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function flashButton(btn){btn.classList.add('copied');setTimeout(function(){btn.classList.remove('copied');},600);}

var newIndicatorModal=document.getElementById('newIndicatorModal'),newIndicatorInput=document.getElementById('newIndicatorInput'),newIndicatorFilename=document.getElementById('newIndicatorFilename'),newIndicatorError=document.getElementById('newIndicatorError');
document.getElementById('editorNew').addEventListener('click',function(){openNewIndicatorModal();});
function openNewIndicatorModal(){newIndicatorInput.value='';newIndicatorFilename.textContent='File: untitled.js';newIndicatorError.textContent='';newIndicatorModal.classList.add('visible');setTimeout(function(){newIndicatorInput.focus();},100);}
function closeNewIndicatorModal(){newIndicatorModal.classList.remove('visible');}
newIndicatorInput.addEventListener('input',function(){var val=newIndicatorInput.value.trim();if(val){var s=val.replace(/[^a-zA-Z0-9_\-]/g,'');newIndicatorFilename.textContent='File: '+(s||'untitled')+'.js';}else{newIndicatorFilename.textContent='File: untitled.js';}});
newIndicatorInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();confirmNewIndicator();}});
document.getElementById('newIndicatorCancel').addEventListener('click',closeNewIndicatorModal);
document.getElementById('newIndicatorContinue').addEventListener('click',confirmNewIndicator);
newIndicatorModal.addEventListener('click',function(e){if(e.target===newIndicatorModal)closeNewIndicatorModal();});
function confirmNewIndicator(){var val=newIndicatorInput.value.trim(),sanitized=val.replace(/[^a-zA-Z0-9_\-]/g,'');if(!sanitized){newIndicatorError.textContent='Please enter a valid name';return;}if(indicators.some(function(ind){return ind.name.toLowerCase()===sanitized.toLowerCase();})){newIndicatorError.textContent='An indicator with this name already exists';return;}createIndicator(sanitized,DEFAULT_INDICATOR_CODE);closeNewIndicatorModal();}

(function(){
  var logoContainer=document.querySelector('.logo-container');
  var bottomBar=document.getElementById('bottomBar');
  var chartContainer=document.getElementById('chartContainer');
  var topControls=document.getElementById('topControls');
  setTimeout(function(){
    logoContainer.classList.add('expanded');
    setTimeout(function(){
      chartContainer.classList.add('visible');
      topControls.classList.add('visible');
      bottomBar.classList.add('visible');
      navigateTo('chart');
    },1200);
  },2200);
})();

initCodeMirror();
createIndicator('MA 10',MA10_CODE);
createIndicator('MA 20',MA20_CODE);
createIndicator('Signals',SIGNALS_EXAMPLE_CODE);
updateIndicatorsList();
updateFloatingIndicators();
updateCurrentIndicatorDisplay();
updateSignalsStats();
updateBadgeVisibility();
</script>
